<!doctype html>
<meta charset="utf-8">
<title>Pose Runner — tests</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px 22px 60px; background: #0a0e1e; color: #dbe4f3;
         font: 14px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; letter-spacing: .5px; margin: 0 0 4px; }
  .sub { color: #8fa6bd; font-size: 13px; margin-bottom: 20px; }
  button { font: inherit; font-weight: 700; padding: 9px 18px; border-radius: 9px; border: none;
           background: #43e8ff; color: #06121a; cursor: pointer; }
  button.ghost { background: none; color: #cfe3f5; border: 1px solid #35507a; }
  table { border-collapse: collapse; width: 100%; max-width: 1000px; margin-top: 18px; }
  th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
       color: #8fa6bd; border-bottom: 1px solid #2a3350; padding: 6px 10px 6px 0; font-weight: 600; }
  td { padding: 5px 10px 5px 0; border-bottom: 1px solid #171d33; vertical-align: top; }
  td.v { font-variant-numeric: tabular-nums; color: #9fb4c8; }
  .suite td { padding-top: 16px; color: #fff; font-weight: 700; letter-spacing: .04em; }
  .pass { color: #46d17f; } .fail { color: #ff6b7d; } .skip { color: #8a93ab; }
  #summary { margin-top: 22px; font-size: 15px; font-weight: 700; }
  iframe { position: fixed; left: -9999px; top: 0; border: 0; }
  code { color: #ffd23f; }
</style>

<h1>Pose Runner — test suite</h1>
<div class="sub">
  Drives the real page in a hidden iframe through <code>window.__dbg</code>. No build step and no
  dependencies: serve the repo (<code>python3 serve.py 5175</code>) and open this file.
</div>
<button id="run">Run all</button>
<button class="ghost" id="rerun-rec">Replay recordings only</button>
<div id="out"></div>
<div id="summary"></div>
<iframe id="game" src="../index.html" width="1280" height="720"></iframe>

<script type="module">
const out = document.getElementById('out');
const frame = document.getElementById('game');
let table, pass = 0, fail = 0, skip = 0;

const esc = t => String(t).replace(/[<&]/g, c => ({ '<': '&lt;', '&': '&amp;' }[c]));
function suite(name) {
  const tr = table.insertRow(); tr.className = 'suite';
  tr.insertCell().colSpan = 4; tr.cells[0].textContent = name;
}
function row(name, ok, detail) {
  const tr = table.insertRow();
  tr.insertCell().innerHTML = `<span class="${ok}">${ok === 'pass' ? 'PASS' : ok === 'fail' ? 'FAIL' : 'SKIP'}</span>`;
  tr.insertCell().textContent = name;
  const c = tr.insertCell(); c.className = 'v'; c.innerHTML = esc(detail ?? '');
  if (ok === 'pass') pass++; else if (ok === 'fail') fail++; else skip++;
}
const check = (name, cond, detail) => row(name, cond ? 'pass' : 'fail', detail);
const near = (a, b, tol) => Math.abs(a - b) <= tol;

function reload() {
  return new Promise(res => {
    frame.onload = () => setTimeout(() => res(frame.contentWindow), 60);
    frame.contentWindow.location.reload();
  });
}
const keys = w => { w.document.getElementById('btn-keys').click(); };

// ------------------------------------------------------------------
// A synthetic human. Not a rigid body: the torso turns as it steps, the
// bob couples to the sway, and the landmark noise arrives in bursts —
// every one of those was added after a real bug slipped past the version
// without it.
// ------------------------------------------------------------------
function makeHuman() {
  let burst = 0;
  return o => {
    const { dist = 1, cx = 0, sink = 0, above = 0.38, shW = 0.26, torso = 0.30,
            yaw = 0, jit = 0.008 } = o;
    if (Math.random() < 0.04) burst = 6;
    const amp = jit * (burst > 0 ? 3.2 : 1); if (burst > 0) burst--;
    const n = () => (Math.random() - 0.5) * 2 * amp;
    const k = 1 / dist, a = -above + sink, b = a + torso;
    const lm = []; for (let i = 0; i < 33; i++) lm.push({ x: 0.5, y: 0.5, visibility: 1 });
    const X = 0.5 - cx * k, hw = shW * k * Math.cos(yaw) / 2 / (4 / 3), tilt = Math.sin(yaw) * 0.012 * k;
    lm[11] = { x: X - hw + n() * 0.3, y: 0.5 + a * k - tilt + n(), visibility: 1 };
    lm[12] = { x: X + hw + n() * 0.3, y: 0.5 + a * k + tilt + n(), visibility: 1 };
    lm[23] = { x: X - hw * 0.8 + n() * 0.3, y: 0.5 + b * k + n(), visibility: 1 };
    lm[24] = { x: X + hw * 0.8 + n() * 0.3, y: 0.5 + b * k + n(), visibility: 1 };
    return { landmarks: [lm] };
  };
}

function poseHarness(w) {
  const d = w.__dbg, g = w.__g, human = makeHuman();
  let t = 0;
  const feed = o => { t += 33; d.handlePose(human(o), t); };
  const calibrate = (o = {}) => {
    d.startCalibration();
    for (let i = 0; i < 80; i++) feed({ ...o, jit: 0.003 });
    d.startPlay();
  };
  let jumps = 0, air = false, duckFrames = 0, lanes = 0, lane = g.lane;
  const watch = () => {
    if (!g.grounded && !air) jumps++;
    air = !g.grounded;
    if (g.poseDuck) duckFrames++;
    if (g.lane !== lane) { lanes++; lane = g.lane; }
  };
  const reset = () => { jumps = 0; air = !g.grounded; duckFrames = 0; lanes = 0; lane = g.lane; };
  return { feed, calibrate, watch, reset, get counts() { return { jumps, duckFrames, lanes }; } };
}

// ------------------------------------------------------------------
async function suiteProjection() {
  suite('Projection — the camera must sit at the same height on every screen');
  const w = frame.contentWindow;
  const shapes = [
    ['desktop 16:9', 1280, 720, 2.64, 0.10],
    ['laptop 16:10', 1440, 900, 2.64, 0.10],
    ['phone portrait', 375, 812, 4.44, 0.25],
    ['tablet portrait', 768, 1024, 3.97, 0.25],
  ];
  for (const [name, W, H, want, tol] of shapes) {
    frame.width = W; frame.height = H;
    await new Promise(r => setTimeout(r, 40));
    w.dispatchEvent(new Event('resize'));
    const l = w.__dbg.layout();
    check(`${name} — camera height`, near(l.camElev, want, tol),
      `${l.camElev.toFixed(2)} units (want ${want} ±${tol}), ${l.W}x${l.H}`);
    check(`${name} — road fits the screen`, (7.2 * l.unit) / l.W < 1.35,
      `road is ${((7.2 * l.unit) / l.W).toFixed(2)}x the screen width`);
  }
  frame.width = 1280; frame.height = 720;
  await new Promise(r => setTimeout(r, 40));
  w.dispatchEvent(new Event('resize'));
}

async function suiteSyntheticPose() {
  const w = await reload();
  suite('Pose — synthetic human');
  const h = poseHarness(w);

  for (const deg of [0, 25, 40, 55]) {
    h.calibrate(); h.reset();
    for (let i = 0; i < 900; i++) {
      const ph = Math.sin(i / 45);
      h.feed({ cx: 0.10 * ph, yaw: (deg * Math.PI / 180) * ph,
               sink: 0.012 * Math.abs(Math.sin(i / 22)), jit: 0.008 });
      h.watch();
    }
    const c = h.counts;
    check(`side sway with ${deg}° of torso turn fires nothing`,
      c.jumps === 0 && c.duckFrames === 0,
      `${c.jumps} jumps, ${c.duckFrames} crouch frames`);
  }

  for (const dist of [0.7, 1, 1.5]) {
    h.calibrate({ dist }); h.reset();
    for (let i = 0; i < 400; i++) { h.feed({ dist, sink: 0.012 * Math.abs(Math.sin(i / 22)) }); h.watch(); }
    const c = h.counts;
    check(`standing still at ${dist}x distance fires nothing`,
      c.jumps === 0 && c.duckFrames === 0 && c.lanes === 0,
      `${c.jumps} jumps, ${c.duckFrames} crouch frames, ${c.lanes} lane changes`);
  }

  h.calibrate(); h.reset();
  for (let i = 1; i <= 6; i++) h.feed({ sink: -0.24 * (i / 6) });
  for (let i = 6; i >= 1; i--) h.feed({ sink: -0.24 * (i / 6) });
  for (let i = 0; i < 30; i++) { h.feed({}); h.watch(); }
  let c = h.counts;
  check('a real hop fires exactly one jump and no crouch',
    c.jumps === 1 && c.duckFrames === 0, `${c.jumps} jumps, ${c.duckFrames} crouch frames`);

  h.calibrate(); h.reset();
  for (let i = 0; i < 20; i++) { h.feed({ sink: 0.091 }); h.watch(); }
  c = h.counts;
  check('a real crouch is held, not tapped', c.duckFrames >= 10 && c.jumps === 0,
    `${c.duckFrames} crouch frames of 20`);

  h.calibrate(); h.reset();
  for (let i = 0; i < 12; i++) { h.feed({ cx: -0.30 * (i / 12) }); h.watch(); }
  for (let i = 0; i < 12; i++) { h.feed({ cx: -0.30 }); h.watch(); }
  c = h.counts;
  check('one long stride moves exactly one lane', c.lanes === 1,
    `${c.lanes} lane changes, ended in lane ${w.__g.lane}`);
}

async function suiteRoute() {
  const w = await reload();
  suite('Coins — the trail is a runnable route');
  const g = w.__g, d = w.__dbg;
  keys(w);
  w.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp' }));

  const solidAt = (lane, z) => {
    for (const o of g.obstacles) {
      if (o.lane !== lane) continue;
      if (o.d - 1.0 > z || o.d + o.depth + 1.0 < z) continue;
      return o.type;
    }
    return null;
  };
  const seen = new Set();
  let coins = 0, inTrain = 0, unreachable = 0, doubleJump = 0, walls = 0, sampled = 0;
  const zSeen = new Set();
  for (let i = 0; i < 20000; i++) {
    g.invuln = 99;
    d.step(1);
    for (const c of g.pickups) {
      if (c.type !== 'coin') continue;
      const z = c.d - g.dist; if (z < 4 || z > 25) continue;
      const k = Math.round(c.d * 100) + ':' + c.lane + ':' + Math.round(c.h * 100);
      if (seen.has(k)) continue; seen.add(k); coins++;
      const s = solidAt(c.lane, c.d);
      if (s === 'train') inTrain++;
      else if (s === 'hurdle' && c.h < 0.9) unreachable++;
      else if (s === 'bar' && c.h > 1.0 && c.h < 2.0) unreachable++;
    }
    const st = g.pickups.filter(p => p.type === 'coin').sort((a, b) => a.d - b.d);
    for (let k = 1; k < st.length; k++) {
      const dz = st[k].d - st[k - 1].d;
      if (dz > 1.6 && dz < 1.8 && Math.abs(st[k].lane - st[k - 1].lane) > 1) doubleJump++;
    }
    for (let z = Math.ceil(g.dist + 20); z < g.dist + 60; z++) {
      if (zSeen.has(z)) continue; zSeen.add(z); sampled++;
      const n = [0, 1, 2].filter(l =>
        g.obstacles.some(o => o.lane === l && o.type === 'train' && o.d <= z && o.d + o.depth >= z)).length;
      if (n === 3) walls++;
    }
  }
  check('no coin sits inside a train', inTrain === 0, `${inTrain} of ${coins} coins`);
  check('no coin is unreachable inside a hurdle or gate', unreachable === 0, `${unreachable} of ${coins}`);
  check('no trail asks for a two-lane step', doubleJump === 0, `${doubleJump} found`);
  check('no impassable wall of trains', walls === 0, `${walls} in ${sampled} units of road`);
}

async function suiteFollower() {
  const w = await reload();
  suite('Coins — following the trail must beat ignoring it');
  const g = w.__g, d = w.__dbg;
  keys(w);
  const key = k => w.dispatchEvent(new KeyboardEvent('keydown', { key: k }));
  key('ArrowUp');
  // A bot that looks at nothing but the coins. If the trail is the route,
  // this survives better than a bot that holds the middle lane.
  const trial = (follow, frames) => {
    const d0 = g.dist, c0 = g.coins; let hits = 0;
    for (let i = 0; i < frames; i++) {
      if (follow) {
        const ahead = g.pickups.filter(p => p.type === 'coin' && p.d - g.dist > 0.6).sort((a, b) => a.d - b.d);
        const t = ahead[0];
        if (t) {
          const z = t.d - g.dist;
          if (z < 9 && t.lane !== g.lane) key(t.lane < g.lane ? 'ArrowLeft' : 'ArrowRight');
          const m = ahead.find(p => p.lane === g.lane && p.d - g.dist > 1.0 && p.d - g.dist < 3.0);
          if (m) { if (m.h > 1.8) key('ArrowUp'); else if (m.h < 0.5) key('ArrowDown'); }
        }
      }
      d.step(1);
      if (g.hearts < 3) { hits += 3 - g.hearts; g.hearts = 3; }
    }
    return { hits: (hits / (g.dist - d0)) * 1000, coins: g.coins - c0 };
  };
  const a = trial(true, 30000), b = trial(false, 30000);
  check('the coin follower takes fewer hits', a.hits < b.hits * 0.75,
    `${a.hits.toFixed(1)} vs ${b.hits.toFixed(1)} hits per 1000 units`);
  check('the coin follower collects far more', a.coins > b.coins * 2,
    `${a.coins} vs ${b.coins} coins`);
}

async function suiteBoot() {
  const w = await reload();
  suite('The boot — off the line and out of standing reach');
  const g = w.__g, d = w.__dbg;
  keys(w);
  const key = k => w.dispatchEvent(new KeyboardEvent('keydown', { key: k }));
  key('ArrowUp');

  let grabbed = 0;
  for (let i = 0; i < 20000; i++) {
    g.invuln = 99; g.boostCooldown = 0;
    const b = g.boost; d.step(1); if (g.boost > b + 0.5) grabbed++;
  }
  check('cannot be collected without ever jumping', grabbed === 0, `${grabbed} collected`);

  const known = new WeakSet(); let n = 0, onLine = 0, tight = 0, minEscape = 99;
  for (let i = 0; i < 20000; i++) {
    g.invuln = 99; g.boostCooldown = 0;
    const lineLane = g.lineLane;
    d.step(1);
    for (const p of g.pickups) {
      if (p.type !== 'boost' || known.has(p)) continue; known.add(p); n++;
      if (p.lane === lineLane) onLine++;
      let clear = 99;
      for (const o of g.obstacles) { if (o.lane !== p.lane) continue; const gap = o.d - p.d; if (gap >= 0 && gap < clear) clear = gap; }
      if (clear < 8) tight++;
      if (clear < minEscape) minEscape = clear;
    }
  }
  check('mostly spawns off the coin line', n > 0 && onLine / n < 0.2,
    `${onLine} of ${n} on the line`);
  check('never spawns without room to escape its lane', tight === 0,
    `tightest escape ${minEscape.toFixed(1)} units`);

  let timed = 0, got = 0;
  for (let i = 0; i < 20000; i++) {
    g.invuln = 99; g.boostCooldown = 0;
    const b = g.pickups.find(p => p.type === 'boost');
    if (b) {
      const z = b.d - g.dist, tt = z / g.speed;
      if (z < 9 && b.lane !== g.lane) key(b.lane < g.lane ? 'ArrowLeft' : 'ArrowRight');
      if (b.lane === g.lane && tt > 0.13 && tt < 0.19 && g.grounded) { timed++; key('ArrowUp'); }
    }
    const before = g.boost; d.step(1); if (g.boost > before + 0.5) got++;
  }
  check('a well-timed jump gets it', timed > 20 && got / timed > 0.8,
    `${got} of ${timed} attempts`);
}

// ------------------------------------------------------------------
// Replay: feed a recording's landmarks back through the detector and count
// what it decides, segment by segment, against the segment's own label.
// ------------------------------------------------------------------
function replay(w, rec) {
  const d = w.__dbg, g = w.__g;
  const byStep = new Map();
  for (const f of rec.frames) {
    if (!byStep.has(f.s)) byStep.set(f.s, []);
    byStep.get(f.s).push(f);
  }
  const toResult = f => {
    const lm = []; for (let i = 0; i < 33; i++) lm.push({ x: 0.5, y: 0.5, visibility: 0 });
    const idx = [11, 12, 23, 24];
    for (let i = 0; i < 4; i++) lm[idx[i]] = { x: f.p[i * 3], y: f.p[i * 3 + 1], visibility: f.p[i * 3 + 2] };
    return { landmarks: [lm] };
  };
  d.startCalibration();
  for (const f of byStep.get('calibrate') || []) d.handlePose(toResult(f), f.t);
  d.startPlay();

  const results = [];
  for (const step of rec.steps) {
    if (!step.expect) continue;
    const frames = byStep.get(step.id) || [];
    if (!frames.length) { results.push({ step, frames: 0 }); continue; }
    let jumps = 0, air = !g.grounded, crouches = 0, ducking = g.poseDuck, lanes = 0, lane = g.lane;
    let prev = frames[0].t;
    for (const f of frames) {
      g.obstacles.length = 0; g.pickups.length = 0; g.invuln = 99;
      d.handlePose(toResult(f), f.t);
      d.step(1, Math.min(0.05, Math.max(0.001, (f.t - prev) / 1000)));
      prev = f.t;
      if (!g.grounded && !air) jumps++; air = !g.grounded;
      if (g.poseDuck && !ducking) crouches++; ducking = g.poseDuck;
      if (g.lane !== lane) { lanes++; lane = g.lane; }
    }
    results.push({ step, frames: frames.length, got: { jumps, crouches, laneChanges: lanes } });
  }
  return results;
}

// ------------------------------------------------------------------
// The recorder, driven end to end off a synthetic clock. A human takes 73
// seconds to walk the script; this walks it in a few thousand frames. It
// proves the file the recorder writes is the file the replay can read —
// which is the part worth knowing *before* somebody stands in front of a
// camera for over a minute.
// ------------------------------------------------------------------
async function suiteRecorder() {
  const w = await reload();
  suite('Recorder — a synthetic session, recorded and replayed');
  const d = w.__dbg, human = makeHuman();
  const script = d.captureScript();

  // What a cooperative human does during each prompt.
  const motion = (id, t, secs) => {
    switch (id) {
      case 'still': case 'calibrate': return {};
      case 'jog': return { sink: 0.012 * Math.abs(Math.sin(t * 9)) };
      // A big turn with only the small drift a planted human cannot avoid.
      case 'sway': { const ph = Math.sin(t * 1.4);
        return { cx: 0.035 * ph, yaw: (40 * Math.PI / 180) * ph }; }
      case 'jogHard': return { sink: 0.05 * Math.abs(Math.sin(t * 11)) };
      case 'jump3': {
        for (const at of [1.5, 4.5, 7.5]) {
          const u = (t - at) / 0.4;                     // a 0.4s hop
          if (u >= 0 && u <= 1) return { sink: -0.24 * Math.sin(u * Math.PI) };
        }
        return {};
      }
      // Half the height of the one above -- small, but still inside the range
      // the sweep says is supported. This suite is about whether the recorder
      // writes a file the replay can read, not about where detection gives up.
      case 'hopSmall': {
        for (const at of [1.5, 4.2, 6.9]) {
          const u = (t - at) / 0.4;
          if (u >= 0 && u <= 1) return { sink: -0.13 * Math.sin(u * Math.PI) };
        }
        return {};
      }
      case 'crouch3': {
        for (const at of [1.5, 5.0, 8.5]) {
          if (t > at && t < at + 1.4) return { sink: 0.10 };
        }
        return {};
      }
      case 'left3': case 'right3': {
        const dir = id === 'left3' ? -1 : 1, cycle = 4.0;
        const u = t % cycle;
        if (t > 3 * cycle) return {};
        if (u < 0.4) return { cx: dir * 0.30 * (u / 0.4) };   // step out
        if (u < 2.0) return { cx: dir * 0.30 };               // stand there
        if (u < 2.4) return { cx: dir * 0.30 * (1 - (u - 2.0) / 0.4) };  // step back
        return {};
      }
      default: return {};
    }
  };

  let now = 0;
  d.startCapture(now, false);
  let rec = null;
  for (const st of script) {
    const t0 = now;
    while (now - t0 <= st.secs * 1000 + 34 && !rec) {
      rec = d.captureFrame(human({ ...motion(st.id, (now - t0) / 1000, st.secs), jit: 0.006 }), now) || null;
      now += 33;
    }
    if (rec) break;
  }

  check('the recorder finishes and returns a file', !!rec, rec ? `${rec.frames.length} frames` : 'never finished');
  if (!rec) return;
  check('every prompt has its own labelled segment',
    script.every(st => rec.frames.some(f => f.s === st.id)),
    rec.steps.map(s => s.id).join(', '));
  check('every frame carries four landmarks',
    rec.frames.every(f => Array.isArray(f.p) && f.p.length === 12 && f.p.every(Number.isFinite)), '');
  check('the file is small enough to live in the repo',
    JSON.stringify(rec).length < 400e3, `${Math.round(JSON.stringify(rec).length / 1024)} KB`);

  const w2 = await reload();
  for (const r of replay(w2, rec)) {
    if (!r.frames) { row(`replayed · ${r.step.id}`, 'skip', 'no frames'); continue; }
    const bad = Object.entries(r.step.expect).filter(([k, v]) => r.got[k] !== v);
    check(`replayed · ${r.step.id}`, bad.length === 0,
      Object.entries(r.step.expect).map(([k, v]) => `${k} ${r.got[k]}/${v}`).join(', '));
  }
}

// ------------------------------------------------------------------
// Replaying a real recording. This is the only suite that can catch a
// failure mode the synthetic human does not contain.
// ------------------------------------------------------------------
async function suiteRecordings() {
  suite('Pose — replayed from a real camera');
  let list = [];
  try {
    list = await (await fetch('recordings/index.json', { cache: 'no-store' })).json();
  } catch (e) { /* none yet */ }
  if (!list.length) {
    row('no recordings found', 'skip',
      'Record one: camera mode, press R, follow the prompts, drop the JSON into tests/recordings/ and add it to recordings/index.json');
    return;
  }
  for (const name of list) {
    const rec = await (await fetch('recordings/' + name, { cache: 'no-store' })).json();
    const w = await reload();
    for (const r of replay(w, rec)) {
      if (!r.frames) { row(`${name} · ${r.step.id}`, 'skip', 'no frames'); continue; }
      const bad = Object.entries(r.step.expect).filter(([k, v]) => r.got[k] !== v);
      check(`${name} · ${r.step.id}`, bad.length === 0,
        Object.entries(r.step.expect).map(([k, v]) => `${k} ${r.got[k]}/${v}`).join(', '));
    }
  }
}

// ------------------------------------------------------------------
// Counting events tells you the detector worked on this recording. It does
// not tell you by how much — and a gate that a jog clears 88% of is one
// slightly bouncier person away from firing. So measure how close the
// segments that must fire *nothing* came to each threshold, and how far
// past it the segments that must fire actually went.
// ------------------------------------------------------------------
const QUIET = ['still', 'jog', 'sway'];   // must never trigger anything

async function suiteMargins() {
  suite('Margins — how close the quiet segments come to each gate');
  let list = [];
  try { list = await (await fetch('recordings/index.json', { cache: 'no-store' })).json(); }
  catch (e) { /* none */ }
  if (!list.length) { row('no recordings', 'skip', 'record one first'); return; }

  for (const name of list) {
    const rec = await (await fetch('recordings/' + name, { cache: 'no-store' })).json();
    const w = await reload();
    const d = w.__dbg, g = w.__g;
    const th = d.poseTh(), SPEED_GATE = 2.9;
    const by = new Map();
    for (const f of rec.frames) { if (!by.has(f.s)) by.set(f.s, []); by.get(f.s).push(f); }
    const toResult = f => {
      const lm = []; for (let i = 0; i < 33; i++) lm.push({ x: 0.5, y: 0.5, visibility: 0 });
      [11, 12, 23, 24].forEach((idx, i) => lm[idx] = { x: f.p[i * 3], y: f.p[i * 3 + 1], visibility: f.p[i * 3 + 2] });
      return { landmarks: [lm] };
    };
    d.startCalibration();
    for (const f of by.get('calibrate') || []) d.handlePose(toResult(f), f.t);
    d.startPlay();

    const peak = {};
    for (const [seg, frames] of by) {
      if (seg === 'calibrate') continue;
      let prev = frames[0].t;
      const p = { dx: 0, drop: 0, vUp: 0, rise: 0 };
      for (const f of frames) {
        g.obstacles.length = 0; g.pickups.length = 0; g.invuln = 99;
        d.handlePose(toResult(f), f.t);
        d.step(1, Math.min(0.05, Math.max(0.001, (f.t - prev) / 1000))); prev = f.t;
        const s = d.poseSignals();
        p.dx = Math.max(p.dx, Math.abs(s.dx));
        p.drop = Math.max(p.drop, s.drop);
        p.vUp = Math.max(p.vUp, s.vUp);
        p.rise = Math.max(p.rise, s.rise);
      }
      peak[seg] = p;
    }
    const worstQuiet = key => Math.max(...QUIET.filter(s => peak[s]).map(s => peak[s][key]));

    // A quiet segment should not get within a quarter of any gate.
    const gates = [
      ['lane', 'dx', th.lane], ['crouch', 'drop', th.duck], ['take-off speed', 'vUp', SPEED_GATE],
    ];
    for (const [label, key, gate] of gates) {
      const worst = worstQuiet(key);
      check(`${name} · standing, jogging or turning stays clear of the ${label} gate`,
        worst < gate * 0.75,
        `worst ${worst.toFixed(2)} of ${gate} — ${((1 - worst / gate) * 100).toFixed(0)}% margin (want 25%+)`);
    }
    // ...and the real action should clear its gate by a wide margin too.
    const real = [
      ['a real step', 'left3', 'dx', th.lane], ['a real crouch', 'crouch3', 'drop', th.duck],
      ['a real hop', 'jump3', 'vUp', SPEED_GATE],
    ];
    for (const [label, seg, key, gate] of real) {
      if (!peak[seg]) continue;
      check(`${name} · ${label} clears its gate with room to spare`,
        peak[seg][key] > gate * 1.5,
        `${peak[seg][key].toFixed(2)} vs ${gate} — ${(peak[seg][key] / gate).toFixed(1)}x`);
    }
    // The height condition that separates a hop from standing up out of a squat.
    if (peak.crouch3 && peak.jump3)
      check(`${name} · a hop rises further above the baseline than a squat recovery`,
        peak.jump3.rise > peak.crouch3.rise * 2,
        `hop +${peak.jump3.rise.toFixed(2)} vs recovery +${peak.crouch3.rise.toFixed(2)}`);
  }
}

// ------------------------------------------------------------------
// A synthetic human built from measurements rather than guesses.
//
// The first version of this model was invented, and every number in it was
// wrong by two to four times: it stepped 0.30 shoulder-widths where a real
// person steps 1.2 to 1.5, hopped 0.24 where a real hop is 0.50, crouched
// 0.38 where a real crouch is 1.4 to 1.85, and put ten times too much noise
// on the shoulders while treating the hips — which are actually eight times
// noisier — as identical. That is why it passed everything while the real
// recording failed three of seven segments.
//
// Rebuilt to the recording's numbers, it can be swept: the recording is one
// person at one distance on one day, and the sweep asks what happens to
// everyone else.
// ------------------------------------------------------------------
const REAL = {
  shoulder: 0.318,      // apparent shoulder width, height-normalised units
  torsoRatio: 1.46,     // shoulder-to-hip distance, in shoulder-widths
  noiseShoulder: 0.0004,
  noiseHip: 0.0030,
  step: 1.30,           // shoulder-widths of lateral travel
  jump: 0.50,           // shoulder-widths the shoulder line rises
  jumpMs: 380,
  crouch: 1.70,         // shoulder-widths the shoulder line drops
  crouchMs: 1450,
  jogBob: 0.15,
  swayLateral: 0.27,
  swayYawDeg: 66,       // foreshortens the shoulders to 40% at the extremes
};

// Seeded, so a sweep gives the same answer twice. With Math.random the noise
// axis flipped between 3 and 4 crouches at the top end from one run to the
// next, which is not a test result, it is a coin.
let rnd = mulberry32(1);
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function synthFrame(p, m) {
  const asp = 4 / 3;
  const S = p.shoulder / p.dist;                      // apparent, height units
  const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) * 0.7;   // ~unit normal
  const ns = () => gauss() * p.noiseShoulder * p.noiseScale;
  const nh = () => gauss() * p.noiseHip * p.noiseScale;
  const shY = 0.5 - 0.30 + m.sink * S;
  const hipY = shY + p.torsoRatio * S;
  const X = 0.5 - (m.cx * S) / asp;
  const half = (S * Math.cos(m.yaw || 0)) / 2 / asp;
  const tilt = Math.sin(m.yaw || 0) * 0.012 / p.dist;
  const lm = []; for (let i = 0; i < 33; i++) lm.push({ x: 0.5, y: 0.5, visibility: 1 });
  lm[11] = { x: X - half + ns(), y: shY - tilt + ns(), visibility: 1 };
  lm[12] = { x: X + half + ns(), y: shY + tilt + ns(), visibility: 1 };
  lm[23] = { x: X - half * 0.8 + nh(), y: hipY + nh(), visibility: 1 };
  lm[24] = { x: X + half * 0.8 + nh(), y: hipY + nh(), visibility: 1 };
  return { landmarks: [lm] };
}

// Motion in shoulder-widths, shaped like the recording's profiles.
function motionAt(kind, t, p) {
  switch (kind) {
    case 'still': return { sink: 0, cx: 0 };
    case 'jog':   return { sink: -p.jogBob * Math.abs(Math.sin(t * 2.5 * Math.PI)), cx: 0 };
    case 'sway': {
      const ph = Math.sin(t * 0.7 * 2 * Math.PI);
      return { sink: 0, cx: p.swayLateral * ph, yaw: (p.swayYawDeg * Math.PI / 180) * ph };
    }
    case 'jump': {
      const period = 1.6, u = (t % period) / period, T = p.jumpMs / 1000 / period;
      if (u < 0.10) return { sink: p.jump * 0.34 * (u / 0.10), cx: 0 };   // the load
      if (u < 0.10 + T) { const v = (u - 0.10) / T; return { sink: -p.jump * 4 * v * (1 - v), cx: 0 }; }
      return { sink: 0, cx: 0 };
    }
    case 'crouch': {
      const period = 2.6, u = (t % period) * 1000, T = p.crouchMs;
      if (u < 300) return { sink: p.crouch * (u / 300), cx: 0 };
      if (u < T - 350) return { sink: p.crouch, cx: 0 };
      if (u < T) return { sink: p.crouch * (1 - (u - (T - 350)) / 350), cx: 0 };
      return { sink: 0, cx: 0 };
    }
    case 'step': {
      const period = 2.6, u = (t % period) * 1000;
      const ease = x => x * x * (3 - 2 * x);
      if (u < 400) return { sink: 0, cx: -p.step * ease(u / 400) };
      if (u < 1600) return { sink: 0, cx: -p.step };
      if (u < 2000) return { sink: 0, cx: -p.step * (1 - ease((u - 1600) / 400)) };
      return { sink: 0, cx: 0 };
    }
  }
}

// One clock for every body in a sweep. Restarting it at zero for each one
// sends the detector's timestamps backwards, which makes every velocity it
// derives negative -- the first body passed and the second reported nothing
// at all, which is a bug in the harness and not in the game.
let synthClock = 0;

// One full session for one body. Returns what the detector decided.
function runBody(w, p) {
  rnd = mulberry32(20260804);
  const d = w.__dbg, g = w.__g;
  const dt = 1000 / p.fps;
  let t = (synthClock += 2000);
  const feed = (kind, tt) => { d.handlePose(synthFrame(p, motionAt(kind, tt, p)), t); t += dt; };
  // Calibration wants both a sample count and a duration, so feed generously
  // and then check it actually took -- an uncalibrated detector reports zero
  // for everything, which reads like a catastrophic failure when it is really
  // "the person never got framed".
  d.startCalibration();
  for (let i = 0; i < 200 && !d.poseBase().calibrated; i++)
    d.handlePose(synthFrame({ ...p, noiseScale: p.noiseScale * 0.4 }, { sink: 0, cx: 0 }), (t += dt));
  if (!d.poseBase().calibrated) { synthClock = t; return { uncalibrated: true }; }
  d.startPlay();

  const out = {};
  const phases = [['still', 3], ['jog', 3], ['sway', 4], ['jump', 4.8], ['crouch', 7.8], ['step', 7.8]];
  for (const [kind, secs] of phases) {
    synthClock = t;
    let jumps = 0, air = !g.grounded, crouches = 0, ducking = g.poseDuck, lanes = 0, lane = g.lane;
    for (let tt = 0; tt < secs; tt += dt / 1000) {
      g.obstacles.length = 0; g.pickups.length = 0; g.invuln = 99;
      feed(kind, tt);
      d.step(1, dt / 1000);
      if (!g.grounded && !air) jumps++; air = !g.grounded;
      if (g.poseDuck && !ducking) crouches++; ducking = g.poseDuck;
      if (g.lane !== lane) { lanes++; lane = g.lane; }
    }
    out[kind] = { jumps, crouches, lanes };
  }
  return out;
}

// 3 jumps, 3 crouches, 3 steps (out and back is 6 lane changes), nothing else.
function bodyVerdict(r) {
  if (r.uncalibrated) return ['never calibrated'];
  const bad = [];
  for (const q of ['still', 'jog', 'sway'])
    if (r[q].jumps || r[q].crouches || r[q].lanes)
      bad.push(`${q}:${r[q].jumps}j/${r[q].crouches}c/${r[q].lanes}L`);
  if (r.jump.jumps !== 3) bad.push(`jumps ${r.jump.jumps}/3`);
  if (r.crouch.crouches !== 3) bad.push(`crouches ${r.crouch.crouches}/3`);
  if (r.step.lanes !== 6) bad.push(`lanes ${r.step.lanes}/6`);
  return bad;
}

async function suiteSweep() {
  const w = await reload();
  suite('Sweep — the same session, for bodies other than the one recorded');
  const base = { ...REAL, dist: 1, noiseScale: 1, fps: 60 };

  const baseBad = bodyVerdict(runBody(w, base));
  check('the body the recording came from', baseBad.length === 0,
    baseBad.join(', ') || 'all correct');

  // The ranges the detector is expected to hold across. Anything outside them
  // is listed below as a known edge rather than pretended away.
  const axes = [
    ['distance from the camera', 'dist', [1.0, 1.15, 1.4, 1.7]],
    ['how far they step', 'step', [0.55, 0.75, 1.0, 1.6, 2.0]],
    ['how high they hop', 'jump', [0.38, 0.44, 0.62, 0.80]],
    ['how deep they crouch', 'crouch', [0.6, 0.9, 1.3, 2.1]],
    ['build (torso against shoulders)', 'torsoRatio', [1.15, 1.30, 1.60, 1.80]],
    ['camera frame rate', 'fps', [15, 24, 30, 48]],
    ['landmark noise', 'noiseScale', [2, 4, 8]],
    ['how much they bob while jogging', 'jogBob', [0.15, 0.25]],
    ['how much they drift while turning', 'swayLateral', [0.20, 0.40]],
  ];
  for (const [label, key, values] of axes) {
    const fails = [];
    for (const v of values) {
      const bad = bodyVerdict(runBody(w, { ...base, [key]: v }));
      if (bad.length) fails.push(`${key}=${v} → ${bad.join(' ')}`);
    }
    check(label, fails.length === 0,
      fails.length ? fails.join('; ') : `holds across ${values.join(', ')}`);
  }

  // Where it stops working. These are recorded, not asserted: a sweep that
  // only ever reports success is not telling you where the cliff is.
  const edges = [
    ['dist', 0.85, 'closer than this and the framing check will not calibrate'],
    ['jump', 0.30, 'a hop this small falls between the height gate and the speed gate'],
    ['jogBob', 0.35, 'a jog this vigorous is taller than a small hop'],
    ['swayLateral', 0.55, 'a drift this large is a lane-sized movement'],
  ];
  for (const [key, v, why] of edges) {
    const bad = bodyVerdict(runBody(w, { ...base, [key]: v }));
    row(`edge: ${key} = ${v}`, 'skip', `${bad.join(' ') || 'still fine'} — ${why}`);
  }
  row('caveat', 'skip',
    'The model take-off peaks around 4.5 shoulder-widths/sec where a real one spikes to 24 — ' +
    'a real landmark jumps between frames at push-off and a smooth parabola does not. ' +
    'The jog-versus-small-hop edges above are indicative; the jogHard and hopSmall capture ' +
    'segments exist to settle them with real data.');
}

// ------------------------------------------------------------------
// What happens when the camera stops cooperating. Every one of these is
// something a real session does: someone walks out of shot, a tab is
// backgrounded, the model briefly locks onto someone else walking past,
// a long skirt hides the hips for the whole run.
//
// Built on the recording rather than on synthetic frames, because the
// interesting part is what the detector does on the way back in, and that
// depends on what it was holding when the pose went.
// ------------------------------------------------------------------
async function suiteRobustness() {
  suite('Robustness — when the camera stops cooperating');
  let list = [];
  try { list = await (await fetch('recordings/index.json', { cache: 'no-store' })).json(); }
  catch (e) { /* none */ }
  if (!list.length) { row('no recordings', 'skip', 'record one first'); return; }
  const rec = await (await fetch('recordings/' + list[0], { cache: 'no-store' })).json();
  const by = new Map();
  for (const f of rec.frames) { if (!by.has(f.s)) by.set(f.s, []); by.get(f.s).push(f); }
  const toResult = (f, vis) => {
    const lm = []; for (let i = 0; i < 33; i++) lm.push({ x: 0.5, y: 0.5, visibility: 0 });
    [11, 12, 23, 24].forEach((idx, i) => lm[idx] = {
      x: f.p[i * 3] + (f.dx || 0), y: f.p[i * 3 + 1],
      visibility: vis ? vis[i > 1 ? 'hip' : 'shoulder'] : f.p[i * 3 + 2],
    });
    return { landmarks: [lm] };
  };

  // Run a scripted session and count everything the detector decided.
  async function session(steps) {
    const w = await reload();
    const d = w.__dbg, g = w.__g;
    d.startCalibration();
    for (const f of by.get('calibrate')) d.handlePose(toResult(f), f.t);
    d.startPlay();
    let t = by.get('calibrate').slice(-1)[0].t;
    const counts = {};
    for (const st of steps) {
      let jumps = 0, air = !g.grounded, crouches = 0, ducking = g.poseDuck, lanes = 0, lane = g.lane;
      for (const ev of st.frames) {
        g.obstacles.length = 0; g.pickups.length = 0; g.invuln = 99;
        t += ev.gap ?? 16;
        if (!ev.blank) d.handlePose(toResult(ev.f, ev.vis), t);
        else d.handlePose(null, t);
        d.step(1, Math.min(0.05, (ev.gap ?? 16) / 1000));
        if (!g.grounded && !air) jumps++; air = !g.grounded;
        if (g.poseDuck && !ducking) crouches++; ducking = g.poseDuck;
        if (g.lane !== lane) { lanes++; lane = g.lane; }
      }
      counts[st.name] = { jumps, crouches, lanes, finite: Number.isFinite(g.dist) && Number.isFinite(g.y) };
    }
    return counts;
  }

  const still = by.get('still'), steps3 = by.get('left3'), crouch = by.get('crouch3');
  const blanks = n => Array.from({ length: n }, () => ({ blank: true }));
  const plain = frames => frames.map(f => ({ f }));

  // 1. Walk out of shot and come back, at three lengths.
  for (const [label, n] of [['half a second', 30], ['three seconds', 180], ['fifteen seconds', 900]]) {
    const r = await session([
      { name: 'gone', frames: blanks(n) },
      { name: 'back', frames: plain(still.slice(0, 120)) },
    ]);
    check(`nothing fires on the way back from ${label} out of shot`,
      r.back.jumps === 0 && r.back.crouches === 0 && r.back.lanes === 0 && r.back.finite,
      `${r.back.jumps} jumps, ${r.back.crouches} crouches, ${r.back.lanes} lane changes`);
  }

  // 2. The pose is lost *while crouching* — the case the code singles out.
  {
    const r = await session([
      { name: 'crouching', frames: plain(crouch.slice(0, 90)) },
      { name: 'lost', frames: blanks(180) },
      { name: 'back', frames: plain(still.slice(0, 120)) },
    ]);
    check('a slide does not survive losing the pose for three seconds',
      r.back.jumps === 0 && r.back.lanes === 0,
      `${r.back.jumps} jumps, ${r.back.lanes} lane changes after`);
  }

  // 3. A backgrounded tab: valid frames, but five seconds of clock missing.
  {
    const r = await session([
      { name: 'before', frames: plain(still.slice(0, 60)) },
      { name: 'gap', frames: [{ f: still[60], gap: 5000 }, ...plain(still.slice(61, 180))] },
    ]);
    check('a five second clock gap with the body still fires nothing',
      r.gap.jumps === 0 && r.gap.crouches === 0 && r.gap.lanes === 0 && r.gap.finite,
      `${r.gap.jumps} jumps, ${r.gap.crouches} crouches, ${r.gap.lanes} lane changes`);
  }

  // 4. The model briefly locks onto someone else: an instant two-shoulder-width
  //    jump sideways and back.
  {
    const jump = still.slice(0, 120).map((f, i) => ({ f: { ...f, dx: i >= 40 && i < 70 ? 0.28 : 0 } }));
    const r = await session([{ name: 'teleport', frames: jump }]);
    check('a teleporting detection costs at most one lane each way',
      r.teleport.lanes <= 2 && r.teleport.jumps === 0 && r.teleport.finite,
      `${r.teleport.lanes} lane changes, ${r.teleport.jumps} jumps`);
  }

  // 5. Hips hidden for the whole session — the long skirt case, which used to
  //    reject every frame and leave the player with a game that did nothing.
  {
    const vis = { shoulder: 0.95, hip: 0.1 };
    const w = await reload();
    const d = w.__dbg, g = w.__g;
    d.startCalibration();
    for (const f of by.get('calibrate')) d.handlePose(toResult(f, vis), f.t);
    const calibrated = d.poseBase().calibrated;
    d.startPlay();
    const count = frames => {
      let jumps = 0, air = !g.grounded, crouches = 0, ducking = g.poseDuck, lanes = 0, lane = g.lane, prev = frames[0].t;
      for (const f of frames) {
        g.obstacles.length = 0; g.pickups.length = 0; g.invuln = 99;
        d.handlePose(toResult(f, vis), f.t);
        d.step(1, Math.min(0.05, Math.max(0.001, (f.t - prev) / 1000))); prev = f.t;
        if (!g.grounded && !air) jumps++; air = !g.grounded;
        if (g.poseDuck && !ducking) crouches++; ducking = g.poseDuck;
        if (g.lane !== lane) { lanes++; lane = g.lane; }
      }
      return { jumps, crouches, lanes };
    };
    check('calibrates with the hips hidden', calibrated, calibrated ? '' : 'never calibrated');
    const q = count(by.get('still'));
    check('hips hidden — standing still still fires nothing',
      q.jumps === 0 && q.crouches === 0 && q.lanes === 0,
      `${q.jumps} jumps, ${q.crouches} crouches, ${q.lanes} lane changes`);
    const j = count(by.get('jump3'));
    check('hips hidden — jumps still register', j.jumps >= 2, `${j.jumps} of 3`);
    const c = count(by.get('crouch3'));
    check('hips hidden — crouches still register', c.crouches >= 2, `${c.crouches} of 3`);
    const l = count(by.get('left3'));
    check('hips hidden — steps still register one lane each', l.lanes === 6, `${l.lanes} of 6`);
  }
}

async function run(only) {
  document.getElementById('run').disabled = true;
  out.innerHTML = '';
  table = document.createElement('table');
  table.innerHTML = '<tr><th style="width:56px">Result</th><th style="width:44%">Check</th><th>Detail</th></tr>';
  out.append(table);
  pass = fail = skip = 0;
  document.getElementById('summary').textContent = 'running…';
  await new Promise(r => (frame.onload = r, frame.contentWindow.location.reload()));
  await new Promise(r => setTimeout(r, 200));
  try {
    if (!only) {
      await suiteProjection();
      await suiteSyntheticPose();
      await suiteRoute();
      await suiteFollower();
      await suiteBoot();
      await suiteRecorder();
    }
    await suiteRecordings();
    await suiteMargins();
    if (!only) await suiteSweep();
    await suiteRobustness();
  } catch (e) {
    row('suite crashed', 'fail', e && e.stack ? e.stack.split('\n')[0] : String(e));
  }
  document.getElementById('summary').innerHTML =
    `<span class="${fail ? 'fail' : 'pass'}">${pass} passed, ${fail} failed</span>` +
    (skip ? `<span class="skip">, ${skip} skipped</span>` : '');
  document.getElementById('run').disabled = false;
}

document.getElementById('run').onclick = () => run(false);
document.getElementById('rerun-rec').onclick = () => run(true);
run(false);
