<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pose Runner</title>
<!-- Optional accounts (playkit). Empty = no accounts, no network calls at all.
     Set this to your playkit URL to enable cloud best scores and leaderboards.
     Webcam frames are never sent anywhere either way. -->
<meta name="playkit-url" content="https://playkit.fly.dev">
<!-- Google sign-in (optional). Empty = email sign-in only. Not a secret. -->
<meta name="google-client-id" content="813381372044-482hc5987g820f217iq4hlnvkibvp4mg.apps.googleusercontent.com">
<style>
  :root {
    --bg: #0b0e1a;
    --cyan: #43e8ff;
    --magenta: #ff4d9e;
    --yellow: #ffd23f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; }

  #hud {
    position: fixed; top: 16px; right: 20px; text-align: right;
    color: #fff; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  #score { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  #best  { font-size: 14px; opacity: .75; margin-top: 2px; }

  #hearts { display: flex; gap: 7px; justify-content: flex-end; margin-top: 10px; }
  .heart { position: relative; width: 24px; height: 24px; filter: drop-shadow(0 2px 5px rgba(0,0,0,.7)); }
  .heart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .heart .base path { fill: rgba(255,255,255,.16); }
  .heart .fill path { fill: #ff4d6a; }
  .heart .fillwrap { position: absolute; inset: 0; clip-path: inset(100% 0 0 0); }

  #mute {
    position: fixed; bottom: 16px; right: 16px; z-index: 20;
    width: 38px; height: 38px; padding: 0; border-radius: 10px; cursor: pointer;
    background: rgba(10,14,30,.6); border: 1px solid #2b3f63;
    display: flex; align-items: center; justify-content: center;
  }
  #mute svg { width: 19px; height: 19px; fill: #9fb4c8; }
  #mute:hover { border-color: var(--cyan); }
  #mute:hover svg { fill: #fff; }
  #mute .off { display: none; }
  #mute.muted .on { display: none; }
  #mute.muted .off { display: block; }

  #coins {
    display: flex; align-items: center; justify-content: flex-end; gap: 5px;
    margin-top: 8px; font-size: 17px; font-weight: 800; color: var(--yellow);
    font-variant-numeric: tabular-nums;
  }
  #coins svg { width: 15px; height: 15px; fill: var(--yellow); }

  #boost {
    margin-top: 6px; font-size: 12px; font-weight: 800; letter-spacing: 1.5px;
    color: #5fd9bd; min-height: 15px; font-variant-numeric: tabular-nums;
  }

  #hud { transition: opacity .5s ease; }
  #hud.dim { opacity: 0; }

  .sum-title { font-size: 15px; font-weight: 800; letter-spacing: 5px; color: #7fd0e8; }
  .sum-score {
    font-size: 62px; font-weight: 800; line-height: 1.05; margin: 2px 0 2px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sum-stats { display: flex; justify-content: center; gap: 34px; margin: 6px 0 4px; }
  .sum-stats div { display: flex; flex-direction: column; gap: 3px; }
  .sum-stats b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sum-stats span { font-size: 10px; letter-spacing: 2px; color: #8fa6bd; }
  .sum-new {
    font-size: 12px; font-weight: 800; letter-spacing: 3px; color: var(--yellow);
    margin-bottom: 10px; animation: toastFade 1.6s ease-out infinite;
  }
  .btn[disabled] { opacity: .35; cursor: default; transform: none; }

  #cat {
    margin-top: 6px; font-size: 12px; font-weight: 800; letter-spacing: 1.5px;
    color: #ff9a5c; min-height: 15px; display: flex; align-items: center;
    justify-content: flex-end; gap: 6px;
  }
  #cat .bar { width: 68px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden; }
  #cat .bar i { display: block; height: 100%; background: #ff9a5c; }

  #toast {
    margin-top: 10px; font-size: 15px; font-weight: 800; letter-spacing: 2px;
    color: var(--yellow); opacity: 0;
  }
  #toast.show { animation: toastFade 1.5s ease-out; }
  @keyframes toastFade {
    0%   { opacity: 0; transform: translateY(-6px); }
    14%  { opacity: 1; transform: none; }
    68%  { opacity: 1; }
    100% { opacity: 0; }
  }

  #cam-panel {
    position: fixed; top: 16px; left: 16px; display: none;
    background: rgba(10,14,30,.75); border: 1px solid rgba(67,232,255,.35);
    border-radius: 12px; padding: 8px; backdrop-filter: blur(6px);
  }
  #cam { display: block; border-radius: 8px; width: 240px; height: 180px; }
  #cam-status { color: var(--cyan); font-size: 13px; margin-top: 6px; text-align: center; min-height: 18px; }
  #recal {
    display: block; margin: 6px auto 0; font-size: 12px; color: #9fb4c8;
    background: none; border: 1px solid #35507a; border-radius: 6px; padding: 3px 10px; cursor: pointer;
  }
  #recal:hover { color: #fff; border-color: var(--cyan); }

  #overlay {
    position: fixed; inset: 0; display: flex; justify-content: center;
    /* `safe center` keeps the panel centred when it fits but falls back to
       top-aligned when it does not, instead of overflowing off both edges
       where the scroll cannot reach it. Short windows are common: a laptop
       with browser chrome, or a split screen. */
    align-items: safe center;
    overflow-y: auto;
    background: rgba(6,8,18,.72); backdrop-filter: blur(4px); z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay.summary { align-items: flex-end; background: none; backdrop-filter: none; }
  #overlay.summary .panel { padding-bottom: 20px; padding-top: 0; }

  /* Optional accounts — hidden entirely when playkit isn't configured. */
  #account-bar {
    position: fixed; top: 10px; right: 12px; z-index: 40;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-family: inherit;
  }
  .acct-who { color: #8b93a7; max-width: 120px; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
  .acct-link {
    background: none; border: none; color: #8b93a7; font: inherit;
    cursor: pointer; padding: 4px 2px; text-decoration: underline;
    text-underline-offset: 3px;
  }
  .acct-link:hover { color: var(--cyan); }
  .acct-backdrop {
    position: fixed; inset: 0; z-index: 200;
    display: grid; place-items: center; padding: 20px;
    background: rgba(6, 8, 16, .78); backdrop-filter: blur(3px);
    font-family: inherit;
  }
  .acct-dialog {
    width: 100%; max-width: 330px; padding: 24px 22px 18px;
    background: #12172a; border: 1px solid #2a3350; border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .65);
  }
  .acct-title { margin: 0; font-size: 17px; font-weight: 800; color: #e8ecf5; }
  .acct-sub { margin: 6px 0 16px; font-size: 12px; line-height: 1.5; color: #8b93a7; }
  .acct-google { display: flex; justify-content: center; }
  .acct-google:empty { display: none; }
  .acct-or {
    display: flex; align-items: center; gap: 8px; margin: 14px 0;
    font-size: 10px; color: #8b93a7; text-transform: uppercase; letter-spacing: .08em;
  }
  .acct-or::before, .acct-or::after { content: ''; flex: 1; height: 1px; background: #2a3350; }
  .acct-form { display: flex; flex-direction: column; gap: 8px; }
  .acct-input {
    padding: 9px 11px; font: inherit; font-size: 13px; color: #e8ecf5;
    background: #0b0e1a; border: 1px solid #2a3350; border-radius: 10px;
  }
  .acct-input:focus { outline: none; border-color: var(--cyan); }
  .acct-error { margin: 0; font-size: 11px; color: var(--magenta); }
  .acct-error:empty, .acct-notice:empty { display: none; }
  .acct-notice { margin: 0; font-size: 11px; line-height: 1.5; color: var(--cyan); }
  .acct-primary {
    margin-top: 2px; padding: 10px; font: inherit; font-size: 13px; font-weight: 700;
    color: #0b0e1a; background: var(--cyan); border: none; border-radius: 10px; cursor: pointer;
  }
  .acct-primary:disabled { opacity: .6; cursor: default; }
  .acct-switch { margin: 12px 0 0; font-size: 11px; color: #8b93a7; text-align: center; }
  .acct-skip {
    width: 100%; margin-top: 14px; padding: 8px; font: inherit; font-size: 12px;
    color: #8b93a7; background: none; border: none; border-top: 1px solid #2a3350; cursor: pointer;
  }
  .acct-skip:hover { color: #e8ecf5; }

  /* Leaderboard inside the game-over panel */
  .lb { margin-top: 16px; padding-top: 12px; border-top: 1px solid #2a3350;
        font-size: 13px; text-align: left; }
  .lb-title { color: #8b93a7; font-size: 11px; letter-spacing: .08em;
              text-transform: uppercase; margin-bottom: 6px; }
  .lb-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px;
            padding: 2px 0; color: #c9d2e4; }
  .lb-row.is-me { color: var(--yellow); font-weight: 700; }
  .panel { text-align: center; color: #fff; max-width: 560px; padding: 24px; flex: 0 0 auto; }
  .panel h1 { font-size: 42px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .panel .sub { color: #9fb4c8; margin: 10px 0 26px; font-size: 15px; line-height: 1.7; }
  .btn {
    display: inline-block; margin: 6px; padding: 14px 30px; font-size: 17px; font-weight: 700;
    border: none; border-radius: 12px; cursor: pointer; color: #06121a;
    background: linear-gradient(135deg, var(--cyan), #2fb8ff);
    box-shadow: 0 6px 24px rgba(67,232,255,.35); transition: transform .1s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.ghost { background: none; color: #cfe3f5; border: 1.5px solid #35507a; box-shadow: none; }
  #mode-guide { margin-top: 26px; display: inline-block; text-align: left; min-height: 96px; }
  .guide-row { display: flex; align-items: baseline; gap: 12px; color: #8fa6bd; font-size: 14px; margin: 9px 0; line-height: 1.5; }
  .guide-row .key {
    flex: 0 0 auto; min-width: 58px; text-align: center; color: #fff; font-size: 13px;
    border: 1px solid #35507a; border-radius: 6px; padding: 2px 8px; background: rgba(255,255,255,.04);
  }
  .guide-row b { color: #fff; }
  .big-msg { font-size: 30px; font-weight: 800; color: #fff; }
  .over-score { font-size: 64px; font-weight: 800; color: var(--yellow); margin: 8px 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="score">0</div>
  <div id="best"></div>
  <div id="hearts"></div>
  <div id="coins"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg><span id="coin-n">0</span></div>
  <div id="boost"></div>
  <div id="cat"></div>
  <div id="toast"></div>
</div>

<div id="cam-panel">
  <canvas id="cam" width="240" height="180"></canvas>
  <div id="cam-status">Starting camera…</div>
  <button id="recal">Recalibrate (C)</button>
</div>

<button id="mute" title="Mute (M)">
  <svg class="on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a6.9 6.9 0 010 13.4v2.1a9 9 0 000-17.6z"/></svg>
  <svg class="off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm18.5-.9l-1.4-1.4L17 9.8l-3.1-3.1v2.8l1.7 1.7L14 12.8v2.8l3.1-3.1 3.1 3.1 1.4-1.4-3.1-3.1 3-3z"/></svg>
</button>

<div id="account-bar"></div>

<div id="overlay">
  <div class="panel" id="overlay-content"></div>
</div>

<script type="module">
/* ============================================================
   Pose Runner — a 3-lane runner you play with your body.
   Pose detection runs 100% locally in the browser (MediaPipe
   WASM); video is never uploaded.

   Accounts are optional (see the playkit-url meta tag): when
   enabled, only your score is sent — never camera data.
   ============================================================ */

import {
  accountsEnabled, initAccounts, reportScore, fetchLeaderboard, leaderboardHtml,
} from './accounts.js';

// ---------- DOM ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const camPanel = document.getElementById('cam-panel');
const camCanvas = document.getElementById('cam');
const camCtx = camCanvas.getContext('2d');
const camStatus = document.getElementById('cam-status');
const overlay = document.getElementById('overlay');
const overlayContent = document.getElementById('overlay-content');
const hud = document.getElementById('hud');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const heartsEl = document.getElementById('hearts');
const toastEl = document.getElementById('toast');
const muteBtn = document.getElementById('mute');
const coinEl = document.getElementById('coin-n');
const boostEl = document.getElementById('boost');
const catEl = document.getElementById('cat');

let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- World / projection ----------
const LANES = [-2.2, 0, 2.2];
const DIVIDERS = [-1.1, 1.1];
const ROAD_EDGE = 3.6;
const NEAR = 6;
const SPAWN_Z = 70;
// world z of the near clip plane: obstacles sweep past the player and are
// dropped once they reach it (the camera sits at z = -NEAR)
const NEAR_CLIP = -5;
const TRAIN_W = 1.9, TRAIN_H = 2.7;
const UNIT = () => W * 0.115;                 // world unit → screen px at z=0
const proj = z => NEAR / (NEAR + Math.max(z, -NEAR * 0.9));
const horizonY = () => H * 0.40;
const baseY = () => H * 0.94;
// Raising the camera by camY pushes everything on the ground *down* the
// screen, by an amount that scales with proj — near things move a lot, distant
// things barely, and the horizon not at all. That parallax is what sells the
// lift; moving the whole image would just look like a pan.
const groundY = z => horizonY() + (baseY() - horizonY() + camY * UNIT()) * proj(z);
const screenX = (wx, z) => W / 2 + (wx - camX) * UNIT() * proj(z);

// ---------- Camera ----------
// The camera follows the player laterally (70%) and rolls a
// little while switching lanes, so the view visibly shifts.
let camX = 0, camY = 0, camRoll = 0, prevRX = 0;

// The camera follows only part of the player's height, and lags, so a jump
// still reads as the player rising rather than the world simply dropping.
function trackCamera(dt) {
  camX += (g.renderX * 0.7 - camX) * Math.min(1, dt * 10);
  camY += (g.y * 0.5 - camY) * Math.min(1, dt * 8);
  const vx = dt > 0 ? (g.renderX - prevRX) / dt : 0;
  prevRX = g.renderX;
  camRoll += (clamp(vx * 0.012, -0.05, 0.05) - camRoll) * Math.min(1, dt * 8);
}

// ---------- Game state ----------
// phase: menu | loading | calibrating | ready | playing | over
let phase = 'menu';
let mode = 'keys'; // 'keys' | 'pose'
const MAX_HEARTS = 3;
const REGEN_SECONDS = 10;   // clean running time that buys back one heart
const IFRAME_SECONDS = 1.4; // grace period after a hit

const g = {
  dist: 0, speed: 0, score: 0,
  lane: 1, renderX: 0,
  y: 0, vy: 0,          // height above the road and vertical speed
  grounded: true,
  surface: 0,           // height of whatever is currently underfoot
  riding: null,         // the train being stood on, if any
  duckUntil: 0,         // keyboard slide timer
  poseDuck: false,      // camera-mode crouch (held posture)
  obstacles: [], nextSpawn: 0,
  pickups: [], nextPickup: 0,
  scenery: [], nextScenery: 0,
  coins: 0, bonus: 0, boost: 0,   // boost = seconds of high-jump left
  boostCooldown: 0,
  t: 0,                           // seconds of running, for animation phases
  slow: 0,                        // seconds of post-stumble slowdown left
  cat: null,                      // { gap, patience } while something chases
  catCooldown: 0,
  shake: 0, overAt: 0,
  hearts: MAX_HEARTS,
  invuln: 0,            // seconds of grace left after a hit
  regen: 0,             // seconds of clean running banked toward a heart
  hitFlash: 0,
};
let speedTier = 0;

// ---------- Hearts HUD ----------
const HEART_PATH = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
const heartFills = [];
for (let i = 0; i < MAX_HEARTS; i++) {
  const wrap = document.createElement('div');
  wrap.className = 'heart';
  wrap.innerHTML =
    `<svg class="base" viewBox="0 0 24 24"><path d="${HEART_PATH}"/></svg>` +
    `<div class="fillwrap"><svg class="fill" viewBox="0 0 24 24"><path d="${HEART_PATH}"/></svg></div>`;
  heartsEl.appendChild(wrap);
  heartFills.push(wrap.querySelector('.fillwrap'));
}
const lastFill = new Array(MAX_HEARTS).fill(-1);
function updateHearts() {
  for (let i = 0; i < MAX_HEARTS; i++) {
    // full hearts are solid; the next one to come back fills from the bottom
    const f = i < g.hearts ? 1 : (i === g.hearts ? Math.min(1, g.regen / REGEN_SECONDS) : 0);
    const pct = Math.round((1 - f) * 100);
    if (pct === lastFill[i]) continue;
    lastFill[i] = pct;
    heartFills[i].style.clipPath = `inset(${pct}% 0 0 0)`;
  }
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;   // restart the animation
  toastEl.classList.add('show');
}
let best = +(localStorage.getItem('poseRunnerBest') || 0);
bestEl.textContent = best ? `BEST ${best}` : '';

function resetGame() {
  g.dist = 0; g.speed = 14; g.score = 0;
  g.lane = 1; g.renderX = 0; g.duckUntil = 0;
  g.y = 0; g.vy = 0; g.grounded = true; g.surface = 0; g.riding = null;
  camY = 0;
  g.boostCooldown = 25;   // not straight away either
  g.obstacles = []; g.nextSpawn = 30; g.shake = 0;
  g.pickups = []; g.nextPickup = 22;
  g.scenery = []; g.nextScenery = 6;
  g.coins = 0; g.bonus = 0; g.boost = 0;
  // On your heels from the first stride — no quiet opening to settle into.
  g.t = 0; g.slow = 0;
  g.cat = { gap: CAT_START_GAP, patience: CAT_PATIENCE };
  g.catCooldown = CAT_COOLDOWN;
  catEl.innerHTML = 'CAT<span class="bar"><i style="width:0%"></i></span>';
  g.hearts = MAX_HEARTS; g.invuln = 0; g.regen = 0; g.hitFlash = 0;
  speedTier = 0;
  updateHearts();
  coinEl.textContent = '0';
  boostEl.textContent = '';
}

// Real vertical physics rather than a fixed arc, so there is something for a
// train roof to interrupt. Tuned to reproduce the old feel exactly: a plain
// hop still peaks at 1.5 units after 0.31s and lands at 0.62s. A boosted one
// clears TRAIN_H, which is the whole point of being able to get up there.
const GRAVITY = 31.2;
const JUMP_V = 9.68;
const JUMP_V_BOOST = 14.35;   // peaks at 3.3, comfortably over a 2.7 roof

function isDucking() { return g.poseDuck || performance.now() < g.duckUntil; }
function jumpHeight() { return g.y; }

// What is underfoot right now: a train roof if we are over one, else the road.
function supportHeight() {
  let s = 0, on = null;
  for (const o of g.obstacles) {
    if (o.type !== 'train' || o.lane !== g.lane) continue;
    const z0 = o.d - g.dist;
    if (z0 <= 0.2 && z0 + o.depth >= -0.2 && TRAIN_H > s) { s = TRAIN_H; on = o; }
  }
  return { h: s, on };
}

function doJump() {
  if (phase === 'paused') { resumeGame(); return; }
  if (phase === 'ready') { startPlay(); return; }
  if (phase === 'summary') { restartRun(); return; }
  if (phase !== 'playing') return;
  if (g.grounded) {
    g.vy = g.boost > 0 ? JUMP_V_BOOST : JUMP_V;
    g.grounded = false;
    g.duckUntil = 0; g.poseDuck = false;
    sfx.jump();
  }
}
function doDuck() {
  if (phase !== 'playing') return;
  g.duckUntil = performance.now() + 750;
  if (!g.grounded && g.vy > -6) g.vy = -14;   // air-dive: slam back down
  sfx.duck();
}
function setLane(l) {
  const nl = Math.max(0, Math.min(2, l));
  if (nl !== g.lane && phase === 'playing') sfx.whoosh();
  g.lane = nl;
}

function startPlay() { resetGame(); setPhase('playing'); }

// Losing a heart knocks the offending obstacle out of the way and grants a
// short grace period, so one train cannot eat the whole health bar.
function loseHeart() {
  g.hearts--;
  g.regen = 0;
  g.invuln = IFRAME_SECONDS;
  g.shake = 1;
  g.hitFlash = 1;
  updateHearts();
  if (g.hearts <= 0) { crash(); return false; }
  sfx.hit();
  return true;
}

function takeHit(o) {
  if (g.invuln > 0) return;
  const i = g.obstacles.indexOf(o);
  if (i >= 0) g.obstacles.splice(i, 1);
  // Stumbling costs you pace as well as a heart, which is what lets anything
  // chasing you close the gap.
  g.slow = SLOW_SECONDS;
  loseHeart();
}

// Being caught: same damage, but no obstacle to clear and no extra slowdown —
// the cat has had its moment and leaves.
function clawHit() { if (g.invuln <= 0) loseHeart(); }

function crash() {
  phase = 'summary'; g.overAt = performance.now(); g.shake = 1;
  g.cat = null; catEl.textContent = '';   // updateChase stops here, so clear it
  syncMusic();
  sfx.crash();
  if (g.score > best) { best = g.score; localStorage.setItem('poseRunnerBest', best); }
  bestEl.textContent = `BEST ${best}`;
  summaryT = 0;
  hud.classList.add('dim');
  showOverlay(`
    <div class="sum-title">RUN COMPLETE</div>
    <div class="sum-score">${g.score}</div>
    <div class="sum-stats">
      <div><b>${Math.floor(g.dist)}</b><span>DISTANCE</span></div>
      <div><b>${g.coins}</b><span>COINS</span></div>
      <div><b>${best}</b><span>BEST</span></div>
    </div>
    ${g.score >= best && g.score > 0 ? '<div class="sum-new">NEW BEST</div>' : ''}
    <button class="btn" id="btn-again" disabled>Run again</button>
    <div class="sub" id="sum-hint">${mode === 'pose' ? 'or jump in place' : 'or press Space'}</div>
    <div id="lb-slot"></div>
  `, true);
  // The button is enabled from renderSummary off the same clock restartRun()
  // checks. Arming it on a wall-clock timeout instead let it go live while
  // summaryT was stalled in a background tab — clickable, and did nothing.
  document.getElementById('btn-again').onclick = () => restartRun();

  // Cloud score + leaderboard, if accounts are on. Fire-and-forget: the
  // game-over screen is already up and must not wait on the network.
  if (accountsEnabled) {
    const finalScore = g.score;
    reportScore(finalScore)
      .then(() => fetchLeaderboard(5))
      .then((entries) => {
        const slot = document.getElementById('lb-slot');
        // The player may have restarted before this resolved.
        if (slot && entries) slot.innerHTML = leaderboardHtml(entries);
      })
      .catch(() => {});
  }
}

// ---------- Obstacle spawning ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const randLane = () => Math.floor(Math.random() * 3);
function spawnPattern(d) {
  const r = Math.random();
  const add = (type, lane, depth) => g.obstacles.push({ type, lane, d, depth });
  if (r < 0.28) {              // hurdle: jump over
    add('hurdle', randLane(), 1.2);
    if (Math.random() < 0.4) add('hurdle', (randLane() + 1) % 3, 1.2);
  } else if (r < 0.52) {       // gate: slide under
    add('bar', randLane(), 1.0);
    if (Math.random() < 0.35) add('bar', (randLane() + 1) % 3, 1.0);
  } else if (r < 0.82) {       // train: switch lanes
    add('train', randLane(), 10);
  } else {                     // two trains: one lane left open
    const a = randLane(); let b = (a + 1 + Math.floor(Math.random() * 2)) % 3;
    add('train', a, 10); add('train', b, 10);
  }
}

// ---------- Pickups ----------
const BOOST_SECONDS = 7;
const BOOST_COOLDOWN = 75;   // seconds of run before another can appear

// The chase. Numbers picked so that running clean pulls away comfortably, one
// stumble nearly closes the whole gap, and two in a row gets you caught.
const CAT_COOLDOWN = 50;     // seconds between chases
const CAT_PATIENCE = 15;     // how long it keeps at it before losing interest
const CAT_START_GAP = 9;
const CAT_MAX_GAP = 16;      // pull this far ahead and it gives up early
// Absolute rates rather than a fraction of your speed: tying them to speed
// made the whole chase limp early on and vicious later, and left the two
// numbers that actually matter — how fast you shake it, how much a stumble
// costs — impossible to set directly.
const CAT_DRIFT = 0.40;      // units/sec you gain while running clean
const CAT_GAIN = 3.2;        // units/sec it gains while you are slowed
const SLOW_SECONDS = 1.8;
const SLOW_FACTOR = 0.80;

// A lane is only free for a pickup if nothing solid overlaps that stretch —
// otherwise coins end up buried inside a train, visible but unreachable.
function laneFree(lane, d0, d1) {
  return !g.obstacles.some(o =>
    o.lane === lane && o.d < d1 + 1.5 && o.d + o.depth > d0 - 1.5);
}

// laneFree can only see obstacles that already exist, and a coin run is up to
// twelve units long, so a train generated afterwards can still land on top of
// one — which is exactly how coins ended up showing through a train. Sweep
// them back out whenever new obstacles appear.
function pruneBuriedPickups() {
  g.pickups = g.pickups.filter(p => !g.obstacles.some(o => {
    if (o.lane !== p.lane) return false;
    if (o.d - 1.2 >= p.d || o.d + o.depth + 1.2 <= p.d) return false;
    if (o.type === 'train') return true;              // solid all the way up
    if (o.type === 'hurdle') return p.h < 0.9;        // only the low ones
    return p.h > 1.0 && p.h < 2.0;                    // inside a gate's bar
  }));
}

function spawnPickups(d) {
  const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
  // The cooldown is in seconds, not distance. A distance gate keeps shrinking
  // in real terms as the run speeds up — the same 1400 units is 40 seconds
  // early on and 29 at full tilt — which is why high jump kept creeping back
  // to feeling constant however far the gate was pushed out.
  if (g.boostCooldown <= 0 && Math.random() < 0.35) {
    const lane = lanes.find(l => laneFree(l, d, d + 1));
    if (lane === undefined) return;
    g.pickups.push({ type: 'boost', lane, d, h: 1.0 });
    g.boostCooldown = BOOST_COOLDOWN;
    return;
  }
  // a run of coins, sometimes arcing up so it pays to jump through it
  const n = Math.floor(rand(5, 9));
  const span = (n - 1) * 1.7;
  const lane = lanes.find(l => laneFree(l, d, d + span));
  if (lane === undefined) return;
  const arc = Math.random() < 0.4;
  for (let i = 0; i < n; i++) {
    const t = n > 1 ? i / (n - 1) : 0;
    g.pickups.push({
      type: 'coin', lane, d: d + i * 1.7,
      h: arc ? 0.6 + Math.sin(t * Math.PI) * 1.9 : 0.6,
    });
  }
}

// ---------- The chase ----------
// The cat runs at a fixed fraction of the speed you *would* have without a
// stumble, so clean running always pulls away and a slowdown always loses
// ground — the penalty for a hit is what drives the whole mechanic.
function updateChase(dt) {
  if (!g.cat) {
    g.catCooldown = Math.max(0, g.catCooldown - dt);
    if (g.catCooldown <= 0 && Math.random() < dt * 0.25) {
      g.cat = { gap: CAT_START_GAP, patience: CAT_PATIENCE };
      showToast('SOMETHING IS FOLLOWING YOU');
      sfx.meow();
    }
    return;
  }

  const c = g.cat;
  c.gap += (g.slow > 0 ? -CAT_GAIN : CAT_DRIFT) * dt;
  c.patience -= dt;

  if (c.gap <= 0) {
    // Caught: it takes a heart and, satisfied, wanders off. Ending the run
    // here would make a single stumble able to cascade straight into death.
    g.cat = null;
    g.catCooldown = CAT_COOLDOWN;
    catEl.textContent = '';
    showToast('THE CAT GOT YOU');
    sfx.meow();
    clawHit();
    return;
  }
  if (c.patience <= 0 || c.gap > CAT_MAX_GAP) {
    g.cat = null;
    g.catCooldown = CAT_COOLDOWN;
    catEl.textContent = '';
    showToast('YOU LOST IT');
    return;
  }
  const closeness = Math.max(0, Math.min(1, 1 - c.gap / CAT_START_GAP));
  catEl.innerHTML = `CAT<span class="bar"><i style="width:${Math.round(closeness * 100)}%"></i></span>`;
}

// ---------- Run summary ----------
// A separate turntable projection, not the game camera. Orbiting the real one
// would swing half the world behind the near plane and fall apart; here the
// robot is the only thing in the scene, so it can be built in body space and
// rotated properly.
const SUMMARY_LOCK = 1.4;     // seconds before input is accepted
let summaryT = 0;

function restartRun() {
  if (phase !== 'summary' || summaryT < SUMMARY_LOCK) return;
  hud.classList.remove('dim');
  resetGame();
  setPhase('playing');
  sfx.jump();
}

function renderSummary(now) {
  const cx = W / 2, floorY = H * 0.52;
  const yaw = summaryT * 0.62;
  const rise = Math.min(1, summaryT / 0.9);
  const scale = H * (0.115 + 0.042 * rise) * (1 + Math.sin(summaryT * 0.5) * 0.02);

  const bg = ctx.createRadialGradient(cx, floorY - H * 0.14, H * 0.04, cx, floorY, H * 0.85);
  bg.addColorStop(0, '#221a3d'); bg.addColorStop(1, '#08060f');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // shaft of light, and the disc it lands on
  ctx.save();
  const beam = ctx.createLinearGradient(0, 0, 0, floorY);
  beam.addColorStop(0, 'rgba(120,220,255,.16)');
  beam.addColorStop(1, 'rgba(120,220,255,0)');
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(cx - scale * 0.55, 0); ctx.lineTo(cx + scale * 0.55, 0);
  ctx.lineTo(cx + scale * 1.5, floorY); ctx.lineTo(cx - scale * 1.5, floorY);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  for (const [rr, col] of [[1.55, 'rgba(67,232,255,.10)'], [1.25, 'rgba(67,232,255,.18)'], [1.0, 'rgba(67,232,255,.30)']]) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(cx, floorY, scale * rr, scale * rr * 0.26, 0, 0, 7); ctx.fill();
  }

  // motes drifting up through the beam
  for (let i = 0; i < 26; i++) {
    const ph = (summaryT * 0.16 + i * 0.137) % 1;
    const sway = Math.sin(summaryT * 0.7 + i) * scale * 0.3;
    const px = cx + ((i * 37 % 100) / 100 - 0.5) * scale * 2.2 + sway;
    const py = floorY - ph * H * 0.62;
    ctx.fillStyle = `rgba(160,240,255,${(1 - ph) * 0.5})`;
    ctx.beginPath(); ctx.arc(px, py, scale * 0.022 * (1 - ph * 0.5), 0, 7); ctx.fill();
  }

  drawHeroRobot(cx, floorY, scale, yaw, summaryT, rise);

  const again = document.getElementById('btn-again');
  if (again) again.disabled = summaryT < SUMMARY_LOCK;
}

// Orthographic turntable: body-space (rx across, ry up, rz forward) rotated
// about the vertical axis, with parts painted back to front by their depth.
function drawHeroRobot(cx, cy, s, yaw, t, rise) {
  const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
  // The entrance is alpha and a small drop, never a vertical squash — scaling
  // the height by it collapsed the whole figure onto the floor line.
  const lift = (1 - rise) * s * 0.5;
  const px = (rx, rz) => cx + (rx * cosY + rz * sinY) * s;
  const pz = (rx, rz) => -rx * sinY + rz * cosY;
  const py = ry => cy - ry * s - lift;
  // Projected width of a box of the given plan size. Without this the figure
  // has no depth at all and folds into a vertical line at side-on angles,
  // which is exactly what a turntable does to parts that all sit at rz = 0.
  const boxW = (w, d) => Math.hypot(w * cosY, d * sinY);

  const breath = Math.sin(t * 1.6) * 0.012;
  const parts = [];
  const add = (depth, fn) => parts.push({ depth, fn });

  const CY = '#43e8ff', CY_D = '#2790b4', LEG = '#2fb8ff', LEG_D = '#1c74a4';
  const shade = (d, lit, dark) => (d < 0 ? dark : lit);

  // A planted stance with one foot forward, so the legs stay apart from every
  // angle rather than overlapping when seen from the side.
  for (const [side, fwd] of [[-1, -0.20], [1, 0.22]]) {
    const rx = side * 0.26;
    add(pz(rx, fwd), () => {
      ctx.strokeStyle = shade(pz(rx, fwd), LEG, LEG_D);
      ctx.lineWidth = s * 0.15; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(px(rx * 0.75, fwd * 0.3), py(0.66));
      ctx.lineTo(px(rx, fwd * 0.8), py(0.32));
      ctx.lineTo(px(rx * 1.1, fwd), py(0.03));
      ctx.stroke();
    });
  }

  // torso as a box, so its silhouette keeps width all the way round
  add(pz(0, 0), () => {
    const w = boxW(0.80, 0.52) * s, h = s * 0.74;
    const x0 = px(0, 0) - w / 2, y0 = py(1.40 + breath);
    ctx.fillStyle = CY;
    roundRect(x0, y0, w, h, s * 0.20); ctx.fill();
    // the shaded flank swaps sides as it turns
    ctx.save();
    roundRect(x0, y0, w, h, s * 0.20); ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    if (sinY >= 0) ctx.fillRect(x0 + w * (1 - Math.abs(sinY) * 0.5), y0, w, h);
    else ctx.fillRect(x0, y0, w * Math.abs(sinY) * 0.5, h);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.24)';
    const gw = w * 0.20 * Math.max(0.25, cosY);
    roundRect(px(-0.22, 0.26) - gw / 2, y0 + h * 0.12, gw, h * 0.55, s * 0.09);
    ctx.fill();
  });

  // arms: one on the hip, one thrown up
  add(pz(-0.46, 0.04), () => {
    ctx.strokeStyle = shade(pz(-0.46, 0.04), CY, CY_D);
    ctx.lineWidth = s * 0.13; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(px(-0.38, 0.02), py(1.32 + breath));
    ctx.lineTo(px(-0.66, 0.16), py(1.08));
    ctx.lineTo(px(-0.30, 0.20), py(0.92));
    ctx.stroke();
  });
  const punch = 1.98 + Math.sin(t * 1.6) * 0.05;
  add(pz(0.46, 0.10), () => {
    ctx.strokeStyle = shade(pz(0.46, 0.10), CY, CY_D);
    ctx.lineWidth = s * 0.13; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(px(0.38, 0.02), py(1.34 + breath));
    ctx.lineTo(px(0.70, 0.16), py(1.64));
    ctx.lineTo(px(0.54, 0.14), py(punch));
    ctx.stroke();
    ctx.fillStyle = shade(pz(0.46, 0.10), CY, CY_D);
    ctx.beginPath(); ctx.arc(px(0.54, 0.14), py(punch), s * 0.105, 0, 7); ctx.fill();
  });

  // neck
  add(pz(0, -0.02), () => {
    ctx.strokeStyle = CY_D; ctx.lineWidth = s * 0.11; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px(0, 0), py(2.10)); ctx.lineTo(px(0, 0), py(2.20));
    ctx.stroke();
  });

  // head — a sphere reads the same from every angle; only the visor turns
  add(pz(0, 0.12), () => {
    const hr = s * 0.28, hyy = py(2.30 + breath), hxx = px(0, 0);
    ctx.fillStyle = '#eef7ff';
    ctx.beginPath(); ctx.arc(hxx, hyy, hr, 0, 7); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(hxx, hyy, hr, 0, 7); ctx.clip();
    ctx.fillStyle = 'rgba(20,40,60,.16)';
    ctx.fillRect(hxx + (sinY >= 0 ? hr * (1 - sinY) : -hr * 2), hyy - hr, hr * 2, hr * 2);
    ctx.restore();
    const face = cosY;
    if (face > 0.06) {
      const vw = hr * 1.26 * face, vx = px(0, 0.26);
      ctx.fillStyle = '#132033';
      roundRect(vx - vw / 2, hyy - hr * 0.34, vw, hr * 0.54, hr * 0.24);
      ctx.fill();
      ctx.fillStyle = CY;
      const ew = Math.max(1, vw * 0.19);
      ctx.fillRect(vx - vw * 0.29, hyy - hr * 0.18, ew, hr * 0.22);
      ctx.fillRect(vx + vw * 0.10, hyy - hr * 0.18, ew, hr * 0.22);
    }
  });

  ctx.save();
  ctx.globalAlpha = rise;
  parts.sort((a, b) => a.depth - b.depth);
  for (const p of parts) p.fn();
  ctx.restore();
}

// ---------- Roadside scenery ----------
// Placed beyond the kerb on both sides. The stretch of road decides what goes
// there, so the run passes through blocks of city and stretches of park rather
// than an even sprinkle of both.
const VERGE = 4.4;

function spawnScenery(d) {
  const park = Math.sin(d * 0.0026) + Math.sin(d * 0.0007) > 0.55;
  for (const side of [-1, 1]) {
    if (Math.random() < 0.22) continue;                 // gaps in the row
    const x = side * (VERGE + Math.random() * 5.5);
    const seed = Math.random();
    if (park || Math.random() < 0.28) {
      g.scenery.push({ type: 'tree', d, x, seed,
        h: rand(2.4, 4.6), r: rand(0.85, 1.5) });
    } else {
      g.scenery.push({ type: 'block', d, x, seed,
        w: rand(1.8, 3.6), dep: rand(2.0, 4.5), h: rand(3.5, 13) });
    }
  }
}

function drawScenery(o, z, day) {
  const unit = UNIT();
  const zF = Math.max(z, NEAR_CLIP);
  if (zF > SPAWN_Z) return;
  const pF = proj(zF);

  if (o.type === 'tree') {
    const gx = screenX(o.x, zF), gyy = groundY(zF);
    const th = o.h * unit * pF, tr = o.r * unit * pF;
    ctx.fillStyle = mixCol('#241a2e', '#5a4232', day);
    ctx.fillRect(gx - unit * pF * 0.10, gyy - th * 0.62, unit * pF * 0.20, th * 0.62);
    const lit = mixCol('#1d3a34', '#4f9b4a', day);
    const dark = mixCol('#132a26', '#316e30', day);
    for (const [ox, oy, k, col] of [[-0.45, 0.06, 0.72, dark], [0.42, 0.10, 0.66, dark],
                                     [0, -0.30, 1.0, lit], [-0.22, 0.22, 0.62, lit]]) {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(gx + ox * tr, gyy - th * 0.62 - tr * 0.55 + oy * tr, tr * k, 0, 7);
      ctx.fill();
    }
    return;
  }

  // a block: the face toward the road, the face toward us, and the roof
  const zB = zF + o.dep, pB = proj(zB);
  const inner = o.x > 0 ? o.x - o.w / 2 : o.x + o.w / 2;
  const outer = o.x > 0 ? o.x + o.w / 2 : o.x - o.w / 2;
  const topY = (xx, zz) => groundY(zz) - o.h * unit * proj(zz);

  poly([[screenX(inner, zF), groundY(zF)], [screenX(inner, zF), topY(inner, zF)],
        [screenX(inner, zB), topY(inner, zB)], [screenX(inner, zB), groundY(zB)]],
       mixCol('#1a1530', '#6a7590', day));
  poly([[screenX(inner, zF), topY(0, zF)], [screenX(outer, zF), topY(0, zF)],
        [screenX(outer, zB), topY(0, zB)], [screenX(inner, zB), topY(0, zB)]],
       mixCol('#241d3e', '#8794ad', day));
  const fw = o.w * unit * pF, fx = screenX(o.x, zF), fy = groundY(zF), fh = o.h * unit * pF;
  ctx.fillStyle = mixCol('#2b2247', '#9aa6bd', day);
  ctx.fillRect(fx - fw / 2, fy - fh, fw, fh);

  // lit windows — a fixed grid per building, and fewer of them by day
  const cols = Math.max(1, Math.round(o.w * 1.5)), rows = Math.max(1, Math.round(o.h * 0.8));
  const wOn = mixCol('#ffd98a', '#c8d8ea', day);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const n = Math.sin((r * 12.9898 + c * 78.233 + o.seed * 43.7) * 43758.5453);
    if ((n - Math.floor(n)) > (day > 0.4 ? 0.35 : 0.55)) continue;
    ctx.fillStyle = wOn;
    ctx.fillRect(fx - fw / 2 + fw * (c + 0.28) / cols, fy - fh + fh * (r + 0.25) / rows,
                 fw / cols * 0.42, fh / rows * 0.42);
  }
}

// ---------- Main loop ----------
let lastT = performance.now();
function tick(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  if (phase === 'playing') update(dt);

  decayFx(dt);

  trackCamera(dt);   // runs in every phase so menus settle too

  if (phase === 'summary') {
    summaryT += dt;
    renderSummary(now);
  } else {
    render(now);
  }
  requestAnimationFrame(tick);
}

// Screen shake and the hit flash decay outside update(), so they keep settling
// on the game-over screen where update() no longer runs.
function decayFx(dt) {
  g.shake = Math.max(0, g.shake - dt * 3);
  g.hitFlash = Math.max(0, g.hitFlash - dt * 2.2);
}

function update(dt) {
  // Speed ramps quickly at first, then keeps creeping up forever, so surviving
  // longer is always what makes the run harder.
  g.t += dt;
  const baseSpeed = 14 + Math.min(22, g.dist * 0.013) + Math.min(12, Math.max(0, g.dist - 1700) * 0.002);
  if (g.slow > 0) g.slow = Math.max(0, g.slow - dt);
  g.speed = baseSpeed * (g.slow > 0 ? SLOW_FACTOR : 1);
  updateChase(dt);
  g.dist += g.speed * dt;
  g.score = Math.floor(g.dist) + g.bonus;
  scoreEl.textContent = g.score;

  if (g.boostCooldown > 0) g.boostCooldown = Math.max(0, g.boostCooldown - dt);
  if (g.boost > 0) {
    g.boost = Math.max(0, g.boost - dt);
    boostEl.textContent = g.boost > 0 ? `HIGH JUMP ${g.boost.toFixed(1)}s` : '';
  }

  const tier = Math.floor((g.speed - 14) / 6);
  if (tier > speedTier) { speedTier = tier; showToast('SPEED UP'); sfx.speedup(); }

  if (g.invuln > 0) g.invuln = Math.max(0, g.invuln - dt);
  if (g.hearts < MAX_HEARTS) {
    g.regen += dt;
    if (g.regen >= REGEN_SECONDS) { g.regen -= REGEN_SECONDS; g.hearts++; sfx.heal(); }
  } else g.regen = 0;
  updateHearts();

  if (g.dist + SPAWN_Z > g.nextSpawn) {
    spawnPattern(g.nextSpawn + SPAWN_Z);
    g.nextSpawn += rand(17, 27);
    pruneBuriedPickups();
  }
  // keep obstacles until they have swept fully past the near clip plane
  g.obstacles = g.obstacles.filter(o => o.d + o.depth - g.dist > NEAR_CLIP);

  // Pickups spawn after obstacles for this stretch, so laneFree() can see
  // what is already there and never bury a coin inside a train.
  if (g.dist + SPAWN_Z > g.nextPickup) {
    spawnPickups(g.nextPickup + SPAWN_Z);
    g.nextPickup += rand(13, 23);
  }
  g.pickups = g.pickups.filter(p => p.d - g.dist > NEAR_CLIP);

  while (g.dist + SPAWN_Z > g.nextScenery) {
    spawnScenery(g.nextScenery + SPAWN_Z);
    g.nextScenery += rand(5, 11);
  }
  g.scenery = g.scenery.filter(o => o.d - g.dist > NEAR_CLIP);

  // vertical physics, landing on whatever is underfoot
  const sup = supportHeight();
  const prevY = g.y;
  g.vy -= GRAVITY * dt;
  g.y += g.vy * dt;

  // A roof only holds you up if you came down onto it from above. Without
  // this, sidestepping into the lane of a train already alongside you
  // teleported you straight onto its roof instead of hitting its flank —
  // which quietly made the whole game close to unloseable.
  const canLand = sup.h === 0 || prevY >= sup.h - 0.05 || g.riding === sup.on;
  const floor = canLand ? sup.h : 0;
  g.surface = floor;
  if (g.y <= floor) {
    if (!g.grounded) {
      g.shake = Math.max(g.shake, floor > 0 ? 0.25 : 0.12);
      if (floor > 0) sfx.land();
    }
    g.y = floor; g.vy = 0; g.grounded = true;
  } else {
    g.grounded = false;
  }
  // A train we are on top of — or clearing at roof height — has to be drawn
  // before the player, or it would be painted over them from in front.
  g.riding = (sup.on && canLand && g.y >= TRAIN_H - 0.3) ? sup.on : null;

  const target = LANES[g.lane];
  g.renderX += (target - g.renderX) * Math.min(1, dt * 11);

  // pickups — reachable up to a bit above head height, so the arcs need a jump
  const reach = jumpHeight() + 1.75;
  for (let i = g.pickups.length - 1; i >= 0; i--) {
    const p = g.pickups[i];
    if (p.lane !== g.lane) continue;
    const z = p.d - g.dist;
    if (z > 0.9 || z < -0.9) continue;
    if (Math.abs(LANES[g.lane] - g.renderX) > 0.9) continue;
    if (p.h > reach) continue;
    g.pickups.splice(i, 1);
    if (p.type === 'coin') {
      g.coins++; g.bonus += 5;
      coinEl.textContent = g.coins;
      sfx.coin();
    } else {
      g.boost = BOOST_SECONDS;
      boostEl.textContent = `HIGH JUMP ${g.boost.toFixed(1)}s`;
      showToast('HIGH JUMP');
      sfx.power();
    }
  }

  // collisions (skipped entirely during the post-hit grace period)
  if (g.invuln <= 0) {
    const h = jumpHeight(), duck = isDucking();
    for (const o of g.obstacles) {
      if (o.lane !== g.lane) continue;
      const z0 = o.d - g.dist, z1 = z0 + o.depth;
      if (z1 < -0.4 || z0 > 0.9) continue;
      if (Math.abs(LANES[g.lane] - g.renderX) > 0.9) continue; // lenient mid-switch
      // A train is only lethal if you hit its face. Come in over the roof
      // line and you land on it instead — that is what a high jump buys you.
      if ((o.type === 'hurdle' && h < 0.55) ||
          (o.type === 'bar' && !duck && h < 0.1) ||
          (o.type === 'train' && h < TRAIN_H - 0.3)) return takeHit(o);
    }
  }
}

// ---------- Rendering ----------
// ---------- Sky cycle ----------
// One body crosses the sky, sinks, and comes back up as the other. A full
// moon-then-sun cycle takes SKY_PERIOD of distance, so it turns over roughly
// every couple of minutes of running rather than being scenery you never see.
const SKY_PERIOD = 2400;

function skyState() {
  const cyc = ((g.dist / SKY_PERIOD) % 2 + 2) % 2;
  const isSun = cyc >= 1;
  const prog = isSun ? cyc - 1 : cyc;          // 0 rising, 1 setting
  const alt = Math.sin(prog * Math.PI);        // 0 at the horizon, 1 overhead
  return { isSun, prog, alt, dayness: isSun ? alt : 0 };
}

const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function mixCol(a, b, t) {
  t = clamp(t, 0, 1);
  const A = hex(a), B = hex(b);
  return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`;
}

function drawCelestial(sk, hy) {
  const x = W * (0.10 + 0.80 * sk.prog) - camX * UNIT() * 0.10;
  const y = hy - sk.alt * H * 0.34;
  const r = H * (sk.isSun ? 0.055 : 0.048);

  const glow = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 5);
  const gc = sk.isSun ? '255,214,120' : '190,214,255';
  glow.addColorStop(0, `rgba(${gc},.42)`);
  glow.addColorStop(1, `rgba(${gc},0)`);
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x, y, r * 5, 0, 7); ctx.fill();

  if (sk.isSun) {
    ctx.fillStyle = '#fff0b8';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,236,150,.55)';
    ctx.beginPath(); ctx.arc(x, y, r * 1.35, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = '#e8eeff';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    // a few craters, so it is legibly a moon and not just a pale dot
    ctx.fillStyle = 'rgba(150,165,200,.55)';
    for (const [ox, oy, cr] of [[-0.32, -0.22, 0.20], [0.26, 0.10, 0.15], [-0.06, 0.34, 0.12]]) {
      ctx.beginPath(); ctx.arc(x + ox * r, y + oy * r, cr * r, 0, 7); ctx.fill();
    }
  }
}

const buildings = [[], []];
(function genSkyline() {
  let seed = 7;
  const rng = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let layer = 0; layer < 2; layer++) {
    let x = 0;
    while (x < 4000) {
      const w = 40 + rng() * 90, h = (layer ? 0.05 : 0.10) + rng() * (layer ? 0.09 : 0.16);
      buildings[layer].push({ x, w, h });
      x += w + rng() * 30;
    }
  }
})();

// Per-car liveries. A train is split into cars and each one picks a colour
// deterministically from its spawn distance, so a passing train flickers
// through several hues instead of reading as one long uniform box.
const CAR_COLORS = [
  { roof: '#3d4a72', side: '#242e52', front: '#4a5a8f', band: '#7fa8e8' }, // blue
  { roof: '#733d52', side: '#4b2436', front: '#8f4a63', band: '#e884a8' }, // magenta
  { roof: '#347366', side: '#1d4a41', front: '#3f8f7d', band: '#5fd9bd' }, // teal
  { roof: '#733f34', side: '#4a251d', front: '#8f4f3f', band: '#e89a7f' }, // rust
  { roof: '#563d73', side: '#38244f', front: '#6b4a8f', band: '#b088e8' }, // purple
];
const CHASSIS = '#141a30';

function poly(pts, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
}

function render(now) {
  ctx.save();
  if (g.shake > 0.01) ctx.translate((Math.random() - 0.5) * g.shake * 18, (Math.random() - 0.5) * g.shake * 14);
  // camera roll around a point near the player
  ctx.translate(W / 2, H * 0.62); ctx.rotate(camRoll); ctx.translate(-W / 2, -H * 0.62);

  const unit = UNIT();
  const hy = horizonY();

  // ---- sky: one body orbits, and each time it dips under the horizon it
  // comes back up as the other one. Everything else in the scene tints off
  // `dayness`, so the whole world changes with it rather than just the disc.
  const sk = skyState();
  const day = sk.dayness;

  const sky = ctx.createLinearGradient(0, 0, 0, hy * 1.15);
  sky.addColorStop(0, mixCol('#0b0e2a', '#4aa8e8', day));
  sky.addColorStop(0.62, mixCol('#2a1a5e', '#93cdf0', day));
  sky.addColorStop(1, mixCol('#b03a8c', '#ffd9a8', day));
  ctx.fillStyle = sky; ctx.fillRect(-90, -90, W + 180, hy * 1.15 + 90);

  drawCelestial(sk, hy);

  // city silhouettes, two parallax layers
  for (let layer = 0; layer < 2; layer++) {
    ctx.fillStyle = mixCol(layer ? '#1b1440' : '#251a52',
                           layer ? '#7c93bd' : '#93a8ce', day * 0.85);
    const off = (g.dist * (layer ? 2.4 : 5)) % 4000 + camX * (layer ? 12 : 22);
    for (const b of buildings[layer]) {
      let bx = b.x - off; if (bx < -300) bx += 4000;
      if (bx > W + 200) continue;
      ctx.fillRect(bx, hy - b.h * H, b.w, b.h * H + 2);
    }
  }

  // Roadside scenery sits on the ground plane but behind everything on the
  // road, so it is drawn between the backdrop and the tarmac, far to near.
  const scenerySorted = [...g.scenery].sort((a, b) => b.d - a.d);

  // ground
  const gnd = ctx.createLinearGradient(0, hy, 0, H);
  gnd.addColorStop(0, mixCol('#171233', '#4a5b46', day * 0.8));
  gnd.addColorStop(1, mixCol('#0d0a20', '#2e3a2c', day * 0.8));
  ctx.fillStyle = gnd; ctx.fillRect(-90, hy, W + 180, H - hy + 90);

  for (const o of scenerySorted) drawScenery(o, o.d - g.dist, day);

  // road
  poly([
    [screenX(-ROAD_EDGE, SPAWN_Z), groundY(SPAWN_Z)],
    [screenX(ROAD_EDGE, SPAWN_Z), groundY(SPAWN_Z)],
    [screenX(ROAD_EDGE, 0), groundY(0)],
    [screenX(-ROAD_EDGE, 0), groundY(0)],
  ], '#191631');

  // neon curbs
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(screenX(s * ROAD_EDGE, SPAWN_Z), groundY(SPAWN_Z));
    ctx.lineTo(screenX(s * ROAD_EDGE, 0), groundY(0));
    ctx.strokeStyle = 'rgba(67,232,255,.8)'; ctx.lineWidth = 2.5; ctx.stroke();
  }

  // lane dashes, scrolling with distance
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  for (const dx of DIVIDERS) {
    for (let k = 0; k < 20; k++) {
      const zStart = k * 4 - (g.dist % 4);
      const zEnd = zStart + 2;
      if (zEnd < 0.2) continue;
      ctx.beginPath();
      ctx.moveTo(screenX(dx, zStart), groundY(zStart));
      ctx.lineTo(screenX(dx, Math.max(zEnd, 0.2)), groundY(Math.max(zEnd, 0.2)));
      ctx.stroke();
    }
  }

  // Far to near. Two obstacles at the same depth (side-by-side trains) must be
  // ordered by how far their lane sits from the camera, or the far one paints
  // over the near one and they appear to pass through each other.
  // Obstacles and pickups share one depth sort. Drawing all of one kind and
  // then all of the other let a distant coin paint straight over a near train.
  const scene = [
    ...g.obstacles.map(o => ({ it: o, pick: false })),
    ...g.pickups.map(p => ({ it: p, pick: true })),
  ].sort((a, b) =>
    (b.it.d - a.it.d) ||
    (Math.abs(LANES[b.it.lane] - camX) - Math.abs(LANES[a.it.lane] - camX)));

  // Anything whose nose is already past the player sits between the camera and
  // the player, so it has to be painted over them, not under — except a train
  // being ridden, which the player is standing on top of.
  const inFront = [];
  for (const s of scene) {
    const z = s.it.d - g.dist;
    const back = s.pick ? z : z + s.it.depth;
    if (z > SPAWN_Z || back < NEAR_CLIP) continue;
    if (z < 0 && s.it !== g.riding) { inFront.push([s, z]); continue; }
    (s.pick ? drawPickup : drawObstacle)(s.it, z);
  }

  // blink through the grace period so being hit is unmistakable
  const blink = g.invuln > 0 && Math.floor(g.invuln * 14) % 2 === 0;
  if (blink) ctx.globalAlpha = 0.28;
  drawPlayer(now);
  ctx.globalAlpha = 1;

  for (const [s, z] of inFront) (s.pick ? drawPickup : drawObstacle)(s.it, z);

  drawCat();   // closest thing on screen, so last

  // speed streaks at high speed
  if (phase === 'playing' && g.speed > 24) {
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 8; i++) {
      const y = rand(0, H), len = rand(30, 90);
      ctx.beginPath(); ctx.moveTo(rand(0, W), y); ctx.lineTo(rand(0, W) + len, y); ctx.stroke();
    }
  }

  if (g.hitFlash > 0.01) {
    ctx.fillStyle = `rgba(255,60,80,${g.hitFlash * 0.32})`;
    ctx.fillRect(-90, -90, W + 180, H + 180);
  }
  ctx.restore();
}

function drawObstacle(o, z) {
  const unit = UNIT();
  const lane = LANES[o.lane];

  if (o.type === 'hurdle' || o.type === 'bar') {
    if (z < NEAR_CLIP) return;
    const p = proj(z), gy = groundY(z), cx = screenX(lane, z);

    if (o.type === 'hurdle') {
      // solid barrier; its height equals the jump clearance the collision
      // check asks for, so clearing it looks exactly like clearing it
      const w = 1.9 * unit * p, hgt = 0.55 * unit * p;
      const x0 = cx - w / 2, yTop = gy - hgt;
      ctx.fillStyle = '#e9edf6';
      ctx.fillRect(x0, yTop, w, hgt);
      const stripes = 5;
      ctx.fillStyle = '#ff4d5e';
      for (let i = 0; i < stripes; i += 2)
        ctx.fillRect(x0 + (w / stripes) * i, yTop, w / stripes + 1, hgt);
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.fillRect(x0, yTop, w, hgt * 0.09);
      ctx.fillStyle = '#252b47';
      ctx.fillRect(x0, gy - hgt * 0.16, w, hgt * 0.16);
    } else {
      const w = 2.0 * unit * p, postW = 0.10 * unit * p;
      const yTop = gy - 2.5 * unit * p, yBar = gy - 1.35 * unit * p;
      ctx.fillStyle = '#8892b0';
      ctx.fillRect(cx - w / 2, yTop, postW, gy - yTop);
      ctx.fillRect(cx + w / 2 - postW, yTop, postW, gy - yTop);
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(cx - w / 2, yBar - 0.28 * unit * p, w, 0.28 * unit * p);
      ctx.fillStyle = '#1a1a2e';
      const n = 5;
      for (let i = 0; i < n; i++)
        if (i % 2) ctx.fillRect(cx - w / 2 + (w / n) * i, yBar - 0.28 * unit * p, w / n, 0.28 * unit * p);
    }
    return;
  }

  // ---- train: a real box — roof + front + whichever side the camera can see
  // narrower than the 2.2 lane pitch so there is real clearance when you run
  // past one — otherwise the side wall is edge-on and its livery is unreadable
  const TW = TRAIN_W, TH = TRAIN_H;
  // the nose may already be behind the player: clip it at the near plane so
  // the body keeps sweeping past instead of freezing in place
  const zF = Math.max(z, NEAR_CLIP), zB = z + o.depth;
  const xL = lane - TW / 2, xR = lane + TW / 2;
  const topY = zz => groundY(zz) - TH * unit * proj(zz);

  // side face: visible only if the camera sits beside the box
  let sideX = null;
  if (camX < xL - 0.05) sideX = xL;
  else if (camX > xR + 0.05) sideX = xR;
  const bandY = (zz, f) => groundY(zz) - TH * f * unit * proj(zz);

  // dark chassis spanning the whole train; the coupling gaps between cars are
  // simply where no car body gets painted over it
  // Both walls, not just the one facing us. The far wall is barely visible,
  // but without it the box is open on that side and anything beyond the train
  // — a coin two lanes over — shows straight through it.
  for (const wx of [xL, xR]) {
    poly([
      [screenX(wx, zF), groundY(zF)], [screenX(wx, zF), topY(zF)],
      [screenX(wx, zB), topY(zB)], [screenX(wx, zB), groundY(zB)],
    ], CHASSIS);
  }
  poly([
    [screenX(xL, zF), topY(zF)], [screenX(xR, zF), topY(zF)],
    [screenX(xR, zB), topY(zB)], [screenX(xL, zB), topY(zB)],
  ], CHASSIS);
  // and the tail, so you cannot see into the box from behind either
  poly([
    [screenX(xL, zB), groundY(zB)], [screenX(xR, zB), groundY(zB)],
    [screenX(xR, zB), topY(zB)], [screenX(xL, zB), topY(zB)],
  ], CHASSIS);

  const nCars = Math.max(1, Math.round(o.depth / 3.2));
  const carLen = o.depth / nCars;
  const SEAM = 0.38;
  const seed = Math.floor(o.d) + o.lane * 3;
  let noseColor = CAR_COLORS[seed % CAR_COLORS.length];

  for (let i = nCars - 1; i >= 0; i--) {   // far car first
    const c0 = z + i * carLen;
    const c1 = c0 + carLen - (i < nCars - 1 ? SEAM : 0);
    if (c1 <= NEAR_CLIP) continue;
    const a = Math.max(c0, NEAR_CLIP);
    const col = CAR_COLORS[(seed + i * 2) % CAR_COLORS.length];
    if (i === 0) noseColor = col;

    poly([
      [screenX(xL, a), topY(a)], [screenX(xR, a), topY(a)],
      [screenX(xR, c1), topY(c1)], [screenX(xL, c1), topY(c1)],
    ], col.roof);

    if (sideX === null) continue;
    poly([
      [screenX(sideX, a), groundY(a)], [screenX(sideX, a), topY(a)],
      [screenX(sideX, c1), topY(c1)], [screenX(sideX, c1), groundY(c1)],
    ], col.side);
    // livery stripe in the car's own accent, so it stays readable on every hue
    poly([
      [screenX(sideX, a), bandY(a, 0.32)], [screenX(sideX, a), bandY(a, 0.42)],
      [screenX(sideX, c1), bandY(c1, 0.42)], [screenX(sideX, c1), bandY(c1, 0.32)],
    ], col.band);
    // windows, anchored to this car so they don't slide along the hull
    for (let wz = c0 + 0.45; wz + 0.95 <= c1 - 0.3; wz += 1.3) {
      const w1 = wz + 0.95;
      if (w1 <= NEAR_CLIP) continue;
      const w0 = Math.max(wz, NEAR_CLIP);
      poly([
        [screenX(sideX, w0), bandY(w0, 0.55)], [screenX(sideX, w0), bandY(w0, 0.82)],
        [screenX(sideX, w1), bandY(w1, 0.82)], [screenX(sideX, w1), bandY(w1, 0.55)],
      ], '#8fb8dd');
    }
  }

  // front face — only while the nose is still ahead of the player; once you
  // are alongside it, the side face is what you should be looking at
  if (z < 0) return;
  const pF = proj(z);
  const fw = TW * unit * pF, fh = TH * unit * pF;
  const fx = screenX(lane, z), fy = groundY(z);
  ctx.fillStyle = noseColor.front;
  ctx.fillRect(fx - fw / 2, fy - fh, fw, fh);
  ctx.fillStyle = noseColor.band;
  ctx.fillRect(fx - fw / 2, fy - fh * 0.42, fw, fh * 0.1);
  ctx.fillStyle = '#bfe3ff';
  ctx.fillRect(fx - fw * 0.34, fy - fh * 0.88, fw * 0.28, fh * 0.3);
  ctx.fillRect(fx + fw * 0.06, fy - fh * 0.88, fw * 0.28, fh * 0.3);
  ctx.fillStyle = '#fff3b0';
  ctx.beginPath(); ctx.arc(fx - fw * 0.3, fy - fh * 0.16, fw * 0.05, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(fx + fw * 0.3, fy - fh * 0.16, fw * 0.05, 0, 7); ctx.fill();
}

function drawPickup(p, z) {
  const unit = UNIT(), pr = proj(z);
  const cx = screenX(LANES[p.lane], z);
  const cy = groundY(z) - p.h * unit * pr;

  if (p.type === 'coin') {
    const r = 0.32 * unit * pr;
    // Width oscillates to fake a spin, offset per coin so a run ripples
    // rather than blinking in unison. Keyed off elapsed time, not distance:
    // on distance the coins spun faster the faster you ran, which at speed 30
    // worked out to about seven flips a second.
    const spin = Math.abs(Math.cos(g.t * 2.6 + p.d * 0.8));
    ctx.fillStyle = 'rgba(255,210,63,.22)';
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(1.2, r * spin), r, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(0.7, r * spin * 0.42), r * 0.48, 0, 0, 7); ctx.fill();
    return;
  }

  // high-jump pickup: a winged boot, beating as it hovers
  const s = 0.95 * unit * pr;
  const beat = Math.sin(g.t * 7 + p.d);
  const lift = beat * s * 0.05;

  const halo = ctx.createRadialGradient(cx, cy, s * 0.1, cx, cy, s * 0.9);
  halo.addColorStop(0, 'rgba(170,240,255,.34)');
  halo.addColorStop(1, 'rgba(170,240,255,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, cy, s * 0.9, 0, 7); ctx.fill();

  // a pair of wings sweeping back and up from the ankle, mirrored
  for (const dir of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const spread = (0.30 + i * 0.19) * (1 + beat * 0.10);
      ctx.fillStyle = ['#eaf9ff', '#c2ecff', '#9bdcf7'][i];
      ctx.beginPath();
      ctx.moveTo(cx + dir * s * 0.16, cy - s * 0.02 + lift);
      ctx.quadraticCurveTo(
        cx + dir * s * (0.20 + spread * 0.8), cy - s * (0.30 + i * 0.10) + lift,
        cx + dir * s * (0.22 + spread), cy - s * (0.10 + i * 0.13) + lift);
      ctx.quadraticCurveTo(
        cx + dir * s * (0.30 + spread * 0.5), cy + s * 0.06 + lift,
        cx + dir * s * 0.16, cy + s * 0.05 + lift);
      ctx.closePath(); ctx.fill();
    }
  }

  // the boot itself
  const bw = s * 0.34, bh = s * 0.30;
  ctx.fillStyle = '#5fd9bd';
  roundRect(cx - bw / 2, cy - s * 0.04 + lift, bw, bh, s * 0.07);
  ctx.fill();
  ctx.fillStyle = '#3fb89d';
  roundRect(cx - bw / 2, cy + bh - s * 0.11 + lift, bw * 1.35, s * 0.10, s * 0.05);
  ctx.fill();
}

// The camera sits 6 units back, so a cat trailing by more than about 2 is
// literally behind it and cannot be projected at all. Its drawn depth is
// therefore compressed into the sliver that is visible, and the real distance
// is carried by how big it is (and by the HUD bar).
function drawCat() {
  const c = g.cat;
  if (!c) return;
  // Scaled against the gap at which it gives up, not the gap it starts at:
  // measuring from the start gap put it at exactly zero on frame one, so it
  // stayed invisible until a stumble happened to pull it closer.
  const near = clamp(1 - c.gap / CAT_MAX_GAP, 0, 1);
  if (near <= 0.02) return;

  const z = -0.15 - near * 0.6;
  const unit = UNIT(), pr = proj(z);
  const cx = screenX(g.renderX, z);
  const s = unit * pr * (0.14 + near * 0.28);
  // Anything standing on the road this close to the camera has its feet below
  // the bottom edge, so the whole animal is lifted clear of it. The contact
  // shadow rides along, which keeps it reading as grounded.
  const gy = groundY(z) - s * 0.55;
  const trot = g.dist * 3.4;
  const bound = Math.sin(trot);              // gait
  const bob = bound * s * 0.06;

  // Three flat tones with a fixed light from the upper left, the same way the
  // trains get their volume — a gradient would sit oddly against everything
  // else. Seen from behind: it is chasing you, and the camera is further back
  // still, so its back is genuinely what faces us. Turning it around to show
  // the face read better in isolation but was simply not what you would see.
  const LIT = '#f2a862', MID = '#dd8a45', DARK = '#a9622e';
  const DEEP = '#7f4720', CREAM = '#f8ddbd';

  const ell = (x, y, rx, ry, col) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
  };

  ctx.save();
  ctx.globalAlpha = Math.min(1, 0.35 + near * 1.4);

  // contact shadow
  ell(cx, gy - s * 0.04, s * 0.60, s * 0.14, 'rgba(0,0,0,.34)');

  // Running away from us, so the head is the furthest part — and from
  // directly behind a running cat it is almost entirely hidden by the raised
  // back. Only the ears and a sliver of crown clear the shoulders. Drawing a
  // whole disc up there, however "correct" the shading, just rebuilds a face:
  // two bumps on a circle is all anyone needs to see one.
  const hx = cx, hy = gy - s * 1.05 + bob * 1.2, hr = s * 0.19;

  for (const dir of [-1, 1]) {
    ctx.fillStyle = dir < 0 ? MID : DARK;
    ctx.beginPath();
    ctx.moveTo(hx + dir * hr * 1.10, hy - hr * 0.55);
    ctx.lineTo(hx + dir * hr * 1.42, hy - hr * 1.95);
    ctx.lineTo(hx + dir * hr * 0.24, hy - hr * 1.05);
    ctx.closePath(); ctx.fill();
  }
  ell(hx, hy, hr, hr * 0.95, DARK);

  // the back, drawn over the head so only its crown clears the shoulders
  ell(cx, gy - s * 0.80 + bob, s * 0.42, s * 0.34, MID);

  // front paws, just visible either side of the shoulders
  ctx.strokeStyle = DEEP;
  ctx.lineWidth = s * 0.12; ctx.lineCap = 'round';
  for (const dir of [-1, 1]) {
    const reach = Math.sin(trot + (dir < 0 ? 0 : Math.PI));
    ctx.beginPath();
    ctx.moveTo(cx + dir * s * 0.32, gy - s * 0.78 + bob);
    ctx.lineTo(cx + dir * s * (0.43 + reach * 0.06), gy - s * (0.50 + Math.max(0, reach) * 0.10));
    ctx.stroke();
  }

  // hind legs driving, behind the rump
  ctx.strokeStyle = DARK;
  ctx.lineWidth = s * 0.19;
  for (const dir of [-1, 1]) {
    const push = Math.sin(trot + (dir < 0 ? Math.PI : 0));
    ctx.beginPath();
    ctx.moveTo(cx + dir * s * 0.30, gy - s * 0.52 + bob);
    ctx.lineTo(cx + dir * s * (0.40 + push * 0.10), gy - s * 0.04);
    ctx.stroke();
  }

  // the rump, nearest to us and so the biggest form
  ell(cx, gy - s * 0.50 + bob, s * 0.50, s * 0.44, MID);
  ell(cx - s * 0.15, gy - s * 0.62 + bob, s * 0.28, s * 0.20, LIT);
  ell(cx, gy - s * 0.30 + bob, s * 0.40, s * 0.18, DARK);

  // Bars across the back only. A stripe down the spine as well turned the
  // markings into a cross, which the eye promptly read as a muzzle.
  ctx.strokeStyle = DEEP;
  ctx.lineCap = 'round';
  ctx.lineWidth = s * 0.07;
  for (const [y, w] of [[0.86, 0.20], [0.70, 0.28], [0.54, 0.32], [0.40, 0.28]]) {
    ctx.beginPath();
    ctx.moveTo(cx - s * w, gy - s * y + bob);
    ctx.quadraticCurveTo(cx, gy - s * (y + 0.08) + bob, cx + s * w, gy - s * y + bob);
    ctx.stroke();
  }

  // tail up and swaying, the nearest thing of all
  const tw = Math.sin(trot * 0.6);
  ctx.strokeStyle = MID;
  ctx.lineWidth = s * 0.16;
  ctx.beginPath();
  ctx.moveTo(cx + s * 0.02, gy - s * 0.86 + bob);   // rooted in the rump
  ctx.quadraticCurveTo(
    cx + s * (0.34 + tw * 0.22), gy - s * 1.28,
    cx + s * (0.20 + tw * 0.44), gy - s * 1.86);
  ctx.stroke();
  ctx.strokeStyle = CREAM;
  ctx.lineWidth = s * 0.15;
  ctx.beginPath();
  ctx.moveTo(cx + s * (0.22 + tw * 0.38), gy - s * 1.72);
  ctx.lineTo(cx + s * (0.20 + tw * 0.44), gy - s * 1.86);
  ctx.stroke();

  ctx.restore();
}

function drawPlayer(now) {
  const unit = UNIT();
  const cx = screenX(g.renderX, 0);
  const gy = groundY(0);
  const h = jumpHeight();
  const duck = isDucking() && g.grounded;
  const py = gy - h * unit;
  const runPhase = g.dist * 2.2;

  // shadow, cast on whatever is underfoot rather than always on the road
  const air = Math.max(0, h - g.surface);
  ctx.fillStyle = `rgba(0,0,0,${0.4 - air * 0.15})`;
  ctx.beginPath();
  ctx.ellipse(cx, gy - g.surface * unit - 3, unit * (0.55 - air * 0.1), unit * 0.11, 0, 0, 7);
  ctx.fill();

  const bodyH = duck ? 0.62 : 1.05, bodyW = duck ? 0.98 : 0.78;
  const legH = duck ? 0.18 : 0.42;
  const bob = (phase === 'playing' && g.grounded && !duck) ? Math.abs(Math.sin(runPhase)) * 0.07 : 0;
  const yBase = py - bob * unit;

  // legs
  if (!g.grounded) {
    ctx.strokeStyle = '#2fb8ff'; ctx.lineWidth = unit * 0.13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - unit * 0.16, yBase - legH * unit);
    ctx.lineTo(cx - unit * 0.3, yBase - legH * unit + unit * 0.18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + unit * 0.16, yBase - legH * unit);
    ctx.lineTo(cx + unit * 0.3, yBase - legH * unit + unit * 0.18); ctx.stroke();
  } else {
    const s = Math.sin(runPhase);
    ctx.strokeStyle = '#2fb8ff'; ctx.lineWidth = unit * 0.13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - unit * 0.16, yBase - legH * unit);
    ctx.lineTo(cx - unit * 0.16 + s * unit * 0.14, yBase); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + unit * 0.16, yBase - legH * unit);
    ctx.lineTo(cx + unit * 0.16 - s * unit * 0.14, yBase); ctx.stroke();
  }

  // body
  const bx = cx - bodyW * unit / 2, byTop = yBase - (legH + bodyH) * unit;
  ctx.fillStyle = '#43e8ff';
  roundRect(bx, byTop, bodyW * unit, bodyH * unit, unit * 0.18);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  roundRect(bx + bodyW * unit * 0.12, byTop + bodyH * unit * 0.12, bodyW * unit * 0.3, bodyH * unit * 0.55, unit * 0.1);
  ctx.fill();

  // head
  const headR = unit * 0.27;
  const headY = byTop - headR * (duck ? 0.4 : 0.75);
  ctx.fillStyle = '#eef7ff';
  ctx.beginPath(); ctx.arc(cx, headY, headR, 0, 7); ctx.fill();
  ctx.fillStyle = '#132033';
  roundRect(cx - headR * 0.62, headY - headR * 0.36, headR * 1.24, headR * 0.55, headR * 0.25);
  ctx.fill();
  ctx.fillStyle = '#43e8ff';
  ctx.fillRect(cx - headR * 0.35, headY - headR * 0.2, headR * 0.24, headR * 0.22);
  ctx.fillRect(cx + headR * 0.12, headY - headR * 0.2, headR * 0.24, headR * 0.22);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- Sound (WebAudio synth, zero asset files) ----------
let audioMuted = localStorage.getItem('poseRunnerMuted') === '1';

const sfx = (() => {
  let ac = null;
  // Safari (and Chrome, when the context predates a user gesture) hands back a
  // suspended context that stays silent until it is explicitly resumed.
  const ensure = () => {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  function tone(f0, f1, dur, type = 'sine', vol = 0.18) {
    if (audioMuted) return;
    try {
      const a = ensure(), t = a.currentTime;
      const o = a.createOscillator(), gn = a.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
      gn.gain.setValueAtTime(vol, t);
      gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(gn).connect(a.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* stay silent if audio is unavailable */ }
  }
  return {
    jump: () => tone(420, 780, 0.18, 'sine'),
    duck: () => tone(300, 140, 0.15, 'sine'),
    whoosh: () => tone(600, 200, 0.1, 'triangle', 0.1),
    hit: () => { tone(320, 90, 0.28, 'square', 0.2); tone(180, 70, 0.22, 'sawtooth', 0.12); },
    heal: () => { tone(520, 900, 0.22, 'sine', 0.16); },
    speedup: () => tone(680, 1180, 0.2, 'triangle', 0.11),
    coin: () => { tone(1050, 1550, 0.09, 'triangle', 0.13); tone(1580, 2100, 0.07, 'sine', 0.07); },
    power: () => { tone(420, 720, 0.14, 'triangle', 0.15); tone(720, 1250, 0.22, 'triangle', 0.13); },
    land: () => tone(240, 120, 0.12, 'sine', 0.16),
    meow: () => { tone(620, 880, 0.16, 'sawtooth', 0.09); tone(880, 520, 0.24, 'triangle', 0.10); },
    crash: () => { tone(200, 45, 0.4, 'sawtooth', 0.25); tone(160, 40, 0.5, 'square', 0.15); },
    unlock: () => ensure(),
    ctx: () => ensure(),
  };
})();

// ---------- Background music ----------
// A four-bar Am–F–C–G loop synthesised on the fly: warm pad, soft bass, a
// delayed pentatonic pluck and a barely-there pulse. Notes are scheduled a
// little ahead of the audio clock from the render loop, so nothing is a file.
const music = (() => {
  const BPM = 82;
  const STEP = 60 / BPM / 2;                 // one eighth note
  const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
  const CHORDS = [
    [57, 60, 64],  // Am
    [53, 57, 60],  // F
    [48, 52, 55],  // C
    [55, 59, 62],  // G
  ];
  const ARP = [0, 2, null, 1, 2, null, 1, 2];

  let a = null, master = null, padBus = null, arpBus = null, noiseBuf = null;
  let nextTime = 0, step = 0, running = false, level = 0, timer = null;
  const LOOKAHEAD = 0.5;

  function build() {
    a = sfx.ctx();
    master = a.createGain();
    master.gain.value = 0;
    master.connect(a.destination);

    padBus = a.createBiquadFilter();
    padBus.type = 'lowpass'; padBus.frequency.value = 950;
    padBus.connect(master);

    arpBus = a.createGain(); arpBus.gain.value = 1;
    const delay = a.createDelay(1);
    delay.delayTime.value = STEP * 1.5;       // dotted-eighth echo
    const damp = a.createBiquadFilter();
    damp.type = 'lowpass'; damp.frequency.value = 1700;
    const fb = a.createGain(); fb.gain.value = 0.34;
    arpBus.connect(delay); delay.connect(damp); damp.connect(fb); fb.connect(delay);
    damp.connect(master); arpBus.connect(master);

    noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.3), a.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }

  function pluck(freq, t, vol) {
    const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = freq;
    f.type = 'lowpass'; f.frequency.value = 2400;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
    o.connect(f).connect(g).connect(arpBus);
    o.start(t); o.stop(t + 0.8);
  }

  function bass(freq, t, dur) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.42, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function pad(notes, t, dur) {
    for (const n of notes) for (const det of [-5, 5]) {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.value = mtof(n); o.detune.value = det;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.05, t + 0.6);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(padBus);
      o.start(t); o.stop(t + dur + 0.1);
    }
  }

  function kick(t) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(115, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.2);
  }

  function hat(t, vol) {
    const s = a.createBufferSource(); s.buffer = noiseBuf;
    const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    s.connect(hp).connect(g).connect(master);
    s.start(t, 0, 0.06);
  }

  function scheduleStep(s, t) {
    const bar = Math.floor(s / 8) % 4, beat = s % 8;
    const chord = CHORDS[bar];
    if (beat === 0) {
      bass(mtof(chord[0] - 12), t, STEP * 8 * 0.92);
      pad(chord, t, STEP * 8 * 0.95);
      kick(t);
    }
    if (beat === 4) kick(t);
    if (beat % 2 === 1) hat(t, 0.05);
    const idx = ARP[beat];
    if (idx !== null) pluck(mtof(chord[idx] + 12), t, beat === 0 ? 0.16 : 0.11);
  }

  return {
    start() {
      if (running || audioMuted) return;
      try {
        if (!a) build();
        running = true;
        step = 0;                        // every run opens on bar one
        nextTime = a.currentTime + 0.08;
        // Deliberately not driven by the render loop: requestAnimationFrame
        // freezes in a background tab, which would kill the music outright.
        if (!timer) timer = setInterval(() => this.tick(), 60);
      } catch (e) { running = false; console.error('music.start failed', e); }
    },
    stop() {
      running = false;
      if (timer) { clearInterval(timer); timer = null; }
      this.setLevel(0);                  // already-queued notes fade out
    },
    debug: () => ({ running, hasCtx: !!a, level, gain: master ? master.gain.value : null,
                    step, ahead: a ? +(nextTime - a.currentTime).toFixed(3) : null }),
    // Timers are throttled in a hidden tab, so resync when we fall behind
    // rather than dumping a burst of stale notes all at once.
    tick() {
      if (!running || !a || audioMuted) return;   // don't synth into a silent bus
      if (nextTime < a.currentTime) nextTime = a.currentTime + 0.05;
      while (nextTime < a.currentTime + LOOKAHEAD) {
        scheduleStep(step, nextTime);
        nextTime += STEP;
        step++;
      }
    },
    setLevel(v) {
      level = v;
      if (!master || !a) return;
      const target = audioMuted ? 0 : v;
      master.gain.cancelScheduledValues(a.currentTime);
      master.gain.setTargetAtTime(target, a.currentTime, 0.35);
    },
  };
})();

// The soundtrack belongs to the run: it starts when you do and ends with it.
// A pause only ducks it, since the run has not actually ended.
function syncMusic() {
  if (phase === 'playing') { music.start(); music.setLevel(0.42); }
  else if (phase === 'paused') music.setLevel(0.12);
  else music.stop();
}

function setMuted(m) {
  audioMuted = m;
  localStorage.setItem('poseRunnerMuted', m ? '1' : '0');
  muteBtn.classList.toggle('muted', m);
  syncMusic();
}

// Audio can only start from a user gesture, and the menu buttons are not the
// only way in — wake the context on the first interaction of any kind. The
// soundtrack itself waits for the run to begin.
for (const evt of ['pointerdown', 'keydown']) {
  window.addEventListener(evt, () => sfx.unlock(), { once: true });
}

muteBtn.classList.toggle('muted', audioMuted);
muteBtn.onclick = () => setMuted(!audioMuted);

// ---------- Keyboard ----------
window.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault();
  if (k === 'm' || k === 'M') { setMuted(!audioMuted); return; }
  if (phase === 'menu') return;
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (phase === 'playing') pauseGame('manual');
    else if (phase === 'paused') resumeGame();
    return;
  }
  if (phase === 'paused') {
    if (k === ' ' || k === 'ArrowUp' || k === 'w') resumeGame();
    return;
  }
  if (phase === 'summary') {
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'Enter') restartRun();
    return;
  }
  if (phase === 'ready' && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', ' '].includes(k)) {
    startPlay(); return;
  }
  if (phase !== 'playing') return;
  if (k === 'ArrowUp' || k === 'w' || k === ' ') doJump();
  else if (k === 'ArrowDown' || k === 's') doDuck();
  else if (k === 'ArrowLeft' || k === 'a') setLane(g.lane - 1);
  else if (k === 'ArrowRight' || k === 'd') setLane(g.lane + 1);
  else if (k === 'c' && mode === 'pose') startCalibration();
});

// ---------- Overlays ----------
function showOverlay(html, summary) {
  overlayContent.innerHTML = html;
  overlay.classList.toggle('summary', !!summary);
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); }
function setPhase(p) {
  phase = p;
  syncMusic();
  if (p === 'playing') hideOverlay();
  if (p === 'ready') showOverlay(`
    <div class="big-msg">${mode === 'pose' ? 'Jump in place to start!' : 'Press any arrow key to start'}</div>
    <div class="sub" style="margin-top:14px">${mode === 'pose'
      ? 'Step left / right to switch lanes · Jump in place · Crouch to slide<br>Press C anytime to recalibrate'
      : '← → switch lanes · ↑ jump · ↓ slide'}</div>
  `);
}

// ---------- Pause ----------
// autoPauseReason tracks *why* we paused, so losing sight of the player can
// resume itself when they step back in, while a manual pause never does.
let autoPauseReason = null;

function pauseGame(reason, title) {
  if (phase !== 'playing') return;
  phase = 'paused';
  autoPauseReason = reason;
  syncMusic();
  showOverlay(`
    <div class="big-msg">${title || 'PAUSED'}</div>
    <div class="sub">${mode === 'pose'
      ? 'Jump in place to resume — or press P / Esc'
      : 'Press P, Esc, or Space to resume'}</div>
    <button class="btn" id="btn-resume">Resume</button>
  `);
  document.getElementById('btn-resume').onclick = resumeGame;
}

function resumeGame() {
  if (phase !== 'paused') return;
  autoPauseReason = null;
  setPhase('playing');
}

window.addEventListener('blur', () => pauseGame('blur'));

function showMenu() {
  phase = 'menu';
  syncMusic();
  showOverlay(`
    <h1>POSE RUNNER</h1>
    <div class="sub">A runner you play with your body.<br>
    Stand 1–2 m from your camera: step sideways to switch lanes,<br>jump in place, crouch to slide.<br>
    Everything runs locally in your browser — no video ever leaves your device.</div>
    <button class="btn" id="btn-pose">Camera Mode</button>
    <button class="btn ghost" id="btn-keys">Keyboard Mode</button>
    <div id="mode-guide"></div>
  `);
  const guides = {
    pose: `
      <div class="guide-row"><span class="key">← →</span><span><b>Step sideways.</b> Each step moves you one lane. Lean or step out and settle back into a comfortable stance — you do not have to hold the position. Step the other way to come back.</span></div>
      <div class="guide-row"><span class="key">↑</span><span><b>Jump in place.</b> Do a small real hop — the jump triggers the moment your hips rise above your calibrated height.</span></div>
