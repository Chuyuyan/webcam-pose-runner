      <div class="guide-row"><span class="key">↓</span><span><b>Crouch.</b> Bend your knees and drop your hips to slide; stay low to keep sliding, stand up to run again.</span></div>`,
    keys: `
      <div class="guide-row"><span class="key">← →</span><span>Switch lanes</span></div>
      <div class="guide-row"><span class="key">↑</span><span>Jump</span></div>
      <div class="guide-row"><span class="key">↓</span><span>Slide</span></div>`,
  };
  const guideEl = document.getElementById('mode-guide');
  const setGuide = m => { guideEl.innerHTML = guides[m]; };
  setGuide('pose');
  const bp = document.getElementById('btn-pose'), bk = document.getElementById('btn-keys');
  for (const [btn, m] of [[bp, 'pose'], [bk, 'keys']]) {
    btn.addEventListener('mouseenter', () => setGuide(m));
    btn.addEventListener('focus', () => setGuide(m));
  }
  bp.onclick = () => { sfx.unlock(); startPoseMode(); };
  bk.onclick = () => { sfx.unlock(); mode = 'keys'; setPhase('ready'); };
}

// ============================================================
//                 Pose control (MediaPipe Pose)
// ============================================================
let landmarker = null, video = null;
let baseHipY = 0, baseShY = 0, baseCX = 0, baseTorso = 0.22;   // baseTorso = apparent shoulder width
// the values calibration actually measured; the adaptive baseline is only
// allowed to wander a bounded distance from them
let calHipY = 0, calShY = 0, calCX = 0;
// Hip landmarks get unreliable when the lower body silhouette is hidden — a
// long skirt or dress is the common case. Shoulders stay dependable, so the
// detector degrades to an upper-body-only mode instead of going dead.
let hipsUsable = true;
let calSamples = [];
let lastJumpAt = 0, lastSeenAt = 0;
// smoothed landmark signals + jump state machine
let sHipY = 0, sShY = 0, sCx = 0, sTorso = 0.25, poseSmoothed = false;
let prevVY = 0, lastPoseAt = 0, lastDuckAt = 0, jumpArmed = true;
let sRawV = null, sRawC = null, sVUp = 0, jumpHold = 0;
const swBuf = new Array(5).fill(0); let swIdx = 0;
let prevCx = 0, laneArmed = true, laneStillSince = 0;
let postureStillSince = 0, duckSince = 0;

// Landmark x is normalised by frame WIDTH and y by frame HEIGHT, so on a 4:3
// feed a horizontal move reads 33% smaller than the same distance vertically.
// Everything is scaled against torso length (a y measurement), so lateral
// offsets have to be converted before they can be compared against it.
const videoAspect = () =>
  (video && video.videoWidth) ? video.videoWidth / video.videoHeight : 4 / 3;

// Framing target, in the mirrored preview's coordinates. Thresholds are
// already torso-scaled so distance does not change what a gesture means, but
// framing still decides how *precise* the reading is: stand too far and the
// body covers too few pixels, so landmark noise grows relative to torso
// length; stand too close and limbs leave the frame and get guessed at; stand
// off to one side and there is no symmetric room left to step into.
const FRAME_BOX = { x0: 0.30, x1: 0.70, y0: 0.08, y1: 0.94 };
const SW_MIN = 0.13, SW_MAX = 0.35;   // apparent shoulder width, as a fraction of frame height
let framingOk = false, framingHint = '';

// Takes raw frame coordinates, not the normalised ones the detector uses —
// framing is a question about where you are in the picture.
function checkFraming(cxNow, shY, hipY, swNow) {
  if (swNow < SW_MIN) return { ok: false, hint: 'Come closer' };
  if (swNow > SW_MAX) return { ok: false, hint: 'Step back' };
  // the preview is a mirror, so left and right are the player's own
  if (cxNow < FRAME_BOX.x0 + 0.05) return { ok: false, hint: 'Move right, into the box' };
  if (cxNow > FRAME_BOX.x1 - 0.05) return { ok: false, hint: 'Move left, into the box' };
  if (shY < FRAME_BOX.y0) return { ok: false, hint: 'Tilt the camera down' };
  if (hipsUsable && hipY > FRAME_BOX.y1) return { ok: false, hint: 'Step back — hips out of frame' };
  return { ok: true, hint: '' };
}

// Thresholds as fractions of torso length — distance-invariant, and shared
// with the camera overlay so the guides always match the real trigger points.
// In shoulder-widths. The signals are already divided by apparent body size,
// so these are plain constants rather than fractions of a measured length —
// nothing here moves when the player does.
function poseTh() {
  return {
    // Measured: a vigorous run-in-place bob peaks at about 0.21 shoulder-widths
    // and a real hop clears 0.6, so this sits between them. Putting it on top
    // of the bob is what made jogging on the spot fire a jump every few
    // seconds. Speed, not height, does the work for quick hops.
    jump: 0.32,
    // The larger of the shoulder and hip drop, so a forward bend at the waist
    // counts too — that is how a lot of people actually duck.
    duck: 0.24,
    // A decisive lean or a small side step.
    lane: 0.34,
    center: 0.16,
  };
}
let calibrated = false;

async function startPoseMode() {
  mode = 'pose';
  camPanel.style.display = 'block';
  phase = 'loading';
  showOverlay(`<div class="big-msg">Loading pose model…</div><div class="sub">First load takes ~5–10 s</div>`);
  try {
    const visionMod = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');
    const { FilesetResolver, PoseLandmarker } = visionMod;
    const fileset = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    landmarker = await PoseLandmarker.createFromOptions(fileset, {
      baseOptions: {
        // `full` rather than `lite`: a few MB more to download and a little
        // more GPU, for noticeably steadier landmarks. The lite model's
        // jitter was a real part of why the controls felt imprecise.
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',
        delegate: 'GPU',
      },
      runningMode: 'VIDEO',
      numPoses: 1,
      // Bias toward holding a lock on someone already found, rather than
      // re-detecting from scratch and popping to a slightly different pose.
      minPoseDetectionConfidence: 0.5,
      minPosePresenceConfidence: 0.5,
      minTrackingConfidence: 0.6,
    });
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' }, audio: false,
    });
    video = document.createElement('video');
    video.srcObject = stream; video.playsInline = true; video.muted = true;
    await video.play();
    requestAnimationFrame(poseLoop);
    startCalibration();
  } catch (err) {
    console.error(err);
    showOverlay(`
      <div class="big-msg">Camera unavailable</div>
      <div class="sub">${err.name === 'NotAllowedError'
        ? 'Camera permission was denied. Allow it and refresh, or play with the keyboard.'
        : 'Could not load the model or camera (the model loads from a CDN — check your connection). You can still play with the keyboard.'}</div>
      <button class="btn ghost" id="btn-fallback">Use Keyboard Mode</button>`);
    document.getElementById('btn-fallback').onclick = () => { mode = 'keys'; camPanel.style.display = 'none'; setPhase('ready'); };
  }
}

function startCalibration() {
  calibrated = false; calSamples = [];
  poseSmoothed = false; sRawV = null; sRawC = null; sVUp = 0; jumpHold = 0; swIdx = 0;
  jumpArmed = true; laneArmed = true; laneStillSince = 0;
  phase = 'calibrating';
  showOverlay(`<div class="big-msg">Line yourself up</div><div class="sub">Step into the box in the camera preview, top left, and stand upright.<br>The box turns green when your framing is good — hold it for 2 seconds.<br>Good framing is what makes the controls precise: too far away and the pose reading gets noisy, too close and your arms leave the frame.</div>`);
}

function poseLoop(now) {
  if (video && video.readyState >= 2 && landmarker) {
    let result = null;
    try { result = landmarker.detectForVideo(video, now); } catch (e) { /* skip a frame on timestamp hiccups */ }
    handlePose(result, now);
    drawCam(result);
  }
  requestAnimationFrame(poseLoop);
}

function handlePose(result, now) {
  const lm = result && result.landmarks && result.landmarks[0];
  if (!lm) {
    // A crouch is exactly the posture most likely to lose the pose: on a
    // desk-height webcam you drop out of frame entirely, and the compressed
    // shape is the hardest for the model to read. Accusing someone of
    // wandering off while they are holding a slide is just wrong, so if we
    // were watching them crouch when the pose went, wait a lot longer.
    const lostFor = now - lastSeenAt;
    const wentWhileDucking = lastDuckAt > 0 && lastSeenAt - lastDuckAt < 400;
    if (lostFor > 1200) g.poseDuck = false;   // never slide forever on a lost pose
    if (now - lastSeenAt > 800) camStatus.textContent = "Can't see you — step back, upper body in frame";
    // nobody in frame is nobody at the keyboard either: hold the run
    if (lostFor > (wentWhileDucking ? 7000 : 2000)) pauseGame('pose', 'Where did you go?');
    return;
  }
  const [ls, rs, lh, rh] = [lm[11], lm[12], lm[23], lm[24]];
  // Shoulders are the only landmarks we insist on. Requiring hips too used to
  // reject the whole frame whenever the lower body was hard to read, which
  // left anyone in a long skirt or dress with a game that simply did nothing.
  const shVis = Math.min(ls.visibility ?? 1, rs.visibility ?? 1);
  const hipVis = Math.min(lh.visibility ?? 1, rh.visibility ?? 1);
  if (shVis < 0.5) { camStatus.textContent = 'Keep your upper body in frame'; return; }
  hipsUsable = hipVis >= 0.6;
  // Coming back from a dropout, the previous sample is stale: differentiating
  // against it manufactures an enormous velocity and fires a jump the instant
  // you are seen again. Resync and hold the trigger for a moment.
  if (now - lastSeenAt > 250) {
    sRawV = null; sRawC = null; sVUp = 0; jumpHold = 0;
    jumpArmed = false; laneArmed = false; laneStillSince = 0;
    lastPoseAt = now;
  }
  lastSeenAt = now;
  // back in frame: pick the run up again (only if losing you is what paused it)
  if (phase === 'paused' && autoPauseReason === 'pose') resumeGame();

  const aspect = videoAspect();

  // Apparent body scale. Shoulder width, not shoulder-to-hip: crouching does
  // not make you narrower, but it does shorten the torso in frame, so a
  // torso-based scale moves for the very posture it is meant to measure.
  const sw = Math.max(0.04, Math.abs(ls.x - rs.x) * aspect);

  // Everything below is measured from the optical axis (frame centre) and
  // divided by that scale. This is the fix for the whole class of bug where
  // stepping *towards or away from* the camera looked like a gesture: a
  // webcam is a perspective projection, so backing off moves shoulders — which
  // sit above the axis — down the frame while hips move up, which is exactly
  // what crouching looks like to a detector watching raw positions. Under this
  // normalisation both the offset and the scale shrink by the same factor when
  // you move, and cancel; a real crouch moves the body but not the width.
  // Mirrored coords: mx=0 is the left of the mirrored view (player's left).
  // Shoulders are weighted over hips because leaning — the quick, natural way
  // to change lanes — swings the shoulders while the hips barely move; an even
  // average threw away half of that motion.
  const shoulderMid = 1 - (ls.x + rs.x) / 2;
  const hipMid = 1 - (lh.x + rh.x) / 2;
  const cxRaw = hipsUsable ? shoulderMid * 0.62 + hipMid * 0.38 : shoulderMid;

  // The scale gets a much heavier filter than the offsets. Real distance
  // changes take half a second or more; shoulder-width jitter is per-frame,
  // and since every signal is *divided* by this number its noise lands
  // straight on top of them.
  // Median of the last five samples, then a light average. Every signal is
  // *divided* by this, so a single bad frame here lands on all of them at
  // once; a median throws spikes away outright, where an average — however
  // slow — folds them in and then lags behind real movement as the price.
  swBuf[swIdx % swBuf.length] = sw; swIdx++;
  const swSorted = swBuf.slice(0, Math.min(swIdx, swBuf.length)).sort((a, b) => a - b);
  const swMed = swSorted[swSorted.length >> 1];
  if (!poseSmoothed) sTorso = swMed;
  else sTorso += (swMed - sTorso) * 0.25;
  const scale = Math.max(0.04, sTorso);

  const shoulderN = ((ls.y + rs.y) / 2 - 0.5) / scale;
  const hipN = ((lh.y + rh.y) / 2 - 0.5) / scale;
  const cx = (cxRaw - 0.5) * aspect / scale;

  // Light smoothing on the offsets: the model jitters by a few pixels frame to
  // frame and a single spike used to be enough to fire a jump.
  if (!poseSmoothed) {
    sHipY = hipN; sShY = shoulderN; sCx = cx;
    poseSmoothed = true;
  } else {
    sHipY += (hipN - sHipY) * 0.6;
    sShY += (shoulderN - sShY) * 0.6;
    sCx += (cx - sCx) * 0.6;
  }

  // Velocities are differentiated from the *raw* positions and only then
  // divided by the scale. Differentiating the ratio instead pulls in a
  // d(scale)/dt term that scales with how far you sit from the optical axis —
  // a 1% wobble in shoulder width was manufacturing a take-off.
  const rawV = hipsUsable ? (lh.y + rh.y) / 2 : (ls.y + rs.y) / 2;
  const rawVs = sRawV === null ? rawV : sRawV + (rawV - sRawV) * 0.6;
  sRawV = rawVs;
  const rawCs = sRawC === null ? cxRaw : sRawC + (cxRaw - sRawC) * 0.6;
  sRawC = rawCs;

  if (phase === 'calibrating') {
    // Framing has to hold for the whole window, not just at the end — a
    // baseline measured while drifting is worse than no baseline.
    const fr = checkFraming(cxRaw, (ls.y + rs.y) / 2, (lh.y + rh.y) / 2, sw);
    framingOk = fr.ok; framingHint = fr.hint;
    if (!fr.ok) {
      calSamples.length = 0;
      camStatus.textContent = fr.hint;
      return;
    }
    calSamples.push({ cx, hipY: hipN, shoulderY: shoulderN, torso: sw });
    camStatus.textContent = `Hold still… ${Math.min(100, Math.round(calSamples.length / 50 * 100))}%`;
    if (calSamples.length >= 50) {
      baseCX = avg(calSamples.map(s => s.cx));
      baseHipY = avg(calSamples.map(s => s.hipY));
      baseShY = avg(calSamples.map(s => s.shoulderY));
      baseTorso = avg(calSamples.map(s => s.torso));
      calHipY = baseHipY; calShY = baseShY; calCX = baseCX;
      calibrated = true;
      prevVY = rawVs; prevCx = rawCs; laneArmed = true; laneStillSince = 0;
      postureStillSince = 0; duckSince = 0;
      lastPoseAt = now; jumpArmed = true; lastDuckAt = 0;
      setPhase('ready');
      camStatus.textContent = 'Calibrated';
    }
    return;
  }
  if (!calibrated) return;

  // keep the framing readout live during play so drifting out is visible
  const frLive = checkFraming(cxRaw, (ls.y + rs.y) / 2, (lh.y + rh.y) / 2, sw);
  framingOk = frLive.ok; framingHint = frLive.hint;

  const th = poseTh();
  const dt = Math.min(0.2, Math.max(0.008, (now - lastPoseAt) / 1000));
  lastPoseAt = now;

  // Vertical reference: hips when we can trust them, shoulders otherwise.
  const vy = hipsUsable ? sHipY : sShY;
  const baseVY = hipsUsable ? baseHipY : baseShY;
  const rise = baseVY - vy;                            // + = body above baseline
  const dx = sCx - baseCX;                             // already in shoulder-widths

  // Crouch: whichever drops further. A squat lowers both; bending forward at
  // the waist lowers the shoulders while the hips barely move, and that used
  // to go completely unnoticed.
  const shDrop = sShY - baseShY;
  const drop = hipsUsable ? Math.max(shDrop, sHipY - baseHipY) : shDrop;
  g.poseDuck = drop > th.duck;
  if (g.poseDuck) { lastDuckAt = now; if (!duckSince) duckSince = now; } else duckSince = 0;

  const vUpRaw = (prevVY - rawVs) / dt / scale;       // shoulder-widths / second
  prevVY = rawVs;
  // A real take-off holds its speed for several frames; landmark noise spikes
  // for one. Gating on the smoothed value keeps the take-off well clear of the
  // threshold while halving anything that only lasts a frame.
  sVUp += (vUpRaw - sVUp) * 0.5;
  const vUp = sVUp;

  // Adaptive baseline. "Where do you actually stand" is a question about
  // whether you are moving, not about how close you are to the previous
  // guess. Keying it off proximity meant that once you settled more than a
  // hair below the baseline — relaxing out of the upright pose you calibrated
  // in — it could never catch up: jumps then needed nearly double the height,
  // and past the crouch threshold you were stuck in a permanent slide with
  // no way back, because being stuck also blocked the adaptation.
  if (Math.abs(vUp) < 0.40 && g.grounded) {
    if (!postureStillSince) postureStillSince = now;
  } else postureStillSince = 0;

  if (postureStillSince && now - postureStillSince > 400) {
    // Nobody holds a slide for seconds on end, so a crouch that old is a bad
    // baseline rather than a real one: adapt out of it at full speed. A brief
    // genuine slide only creeps, so it is never quietly absorbed.
    const staleDuck = duckSince && now - duckSince > 2500;
    const rate = (g.poseDuck && !staleDuck) ? 0.004 : 0.03;
    baseShY += (sShY - baseShY) * rate;
    baseShY = clamp(baseShY, calShY - 0.7, calShY + 0.7);
    if (hipsUsable) baseHipY += (sHipY - baseHipY) * rate;
    baseTorso += (sTorso - baseTorso) * 0.02;
    // Sideways re-centring is not done here — the step detector owns baseCX,
    // and a second source drifting it would fight the one-step-one-lane rule.
    baseHipY = clamp(baseHipY, calHipY - 0.7, calHipY + 0.7);
  }
  // Two ways in. The slow path waits for real height, which is unavoidably
  // late: you have to physically rise ~9cm first, and a jump starts with a
  // dip, so at the actual push-off `rise` is still negative. The fast path
  // fires on the push-off itself. Running on the spot bobs at up to ~0.8
  // torso/sec, while a real take-off reaches 3-4, so the gap is wide enough
  // to trigger on speed alone without the position gate.
  // Measured: a vigorous run-in-place bob peaks around 2.1 shoulder-widths/sec
  // and a real hop around 4.2, so the gate sits between them rather than on
  // top of the bob.
  const tookOff = vUp > 2.9;
  const roseEnough = rise > th.jump && vUp > 0.62;
  // Hold for two frames before firing. A noise-driven crossing lasts one; a
  // real take-off lasts many. Costs 33ms and removes the last of the
  // false jumps that survived every threshold change.
  if (tookOff || roseEnough) jumpHold++; else jumpHold = 0;
  if (jumpArmed && jumpHold >= 2 &&
      now - lastJumpAt > 380 && now - lastDuckAt > 300) {
    jumpArmed = false; jumpHold = 0;
    lastJumpAt = now;
    doJump();
  }
  if (!jumpArmed && rise < th.jump * 0.4) jumpArmed = true;

  // Lane control is *relative*: one step moves you one lane, wherever you
  // happen to be standing. Mapping absolute position onto a lane meant the
  // zones were only ~13cm wide, so a single long stride crossed two
  // boundaries at once and skipped a lane.
  const vLat = Math.abs(prevCx - rawCs) * aspect / dt / scale;     // shoulder-widths/sec
  prevCx = rawCs;

  if (laneArmed && Math.abs(dx) > th.lane) {
    const dir = Math.sign(dx);
    const next = clamp(g.lane + dir, 0, 2);
    if (next !== g.lane) setLane(next);
    // Move the neutral point to the crossing itself, so the rest of *this*
    // stride cannot immediately re-cross and take a second lane.
    baseCX = clamp(baseCX + dir * th.lane, calCX - 1.6, calCX + 1.6);
    laneArmed = false;
    laneStillSince = 0;
  }
  if (!laneArmed) {
    // Re-arm on the deceleration between steps, not on standing still. Two
    // brisk steps in a row never have a still moment in them, so demanding one
    // swallowed the second step entirely. The hard timeout is the backstop:
    // whatever happens, control comes back.
    if (!laneStillSince) laneStillSince = now;
    const slowed = vLat < 1.3;
    if ((slowed && now - laneStillSince > 90) || now - laneStillSince > 520) {
      // Re-arm against the instantaneous position, not the smoothed one: the
      // filter is still converging at this moment, and the rest of that
      // convergence looks exactly like a fresh step, which took a second lane
      // off the back of one long stride.
      baseCX = clamp(cx, calCX - 1.6, calCX + 1.6);
      laneArmed = true;
      laneStillSince = 0;
    } else if (!slowed) {
      laneStillSince = Math.max(laneStillSince, now - 89);
    }
  }

  if (phase === 'playing') {
    camStatus.textContent = g.poseDuck ? 'Slide' : (!g.grounded ? 'Jump!' : ['Left lane', 'Center lane', 'Right lane'][g.lane]);
  }
}

const avg = a => a.reduce((s, v) => s + v, 0) / a.length;

function drawCam(result) {
  const w = camCanvas.width, h = camCanvas.height;
  camCtx.save();
  camCtx.translate(w, 0); camCtx.scale(-1, 1);
  camCtx.drawImage(video, 0, 0, w, h);
  camCtx.restore();

  // Framing target. Solid and bright while calibrating (it is a thing to do),
  // faint once running (it is only a reference).
  const calibrating = phase === 'calibrating';
  if (calibrating || calibrated) {
    const bx = FRAME_BOX.x0 * w, by = FRAME_BOX.y0 * h;
    const bw = (FRAME_BOX.x1 - FRAME_BOX.x0) * w, bh = (FRAME_BOX.y1 - FRAME_BOX.y0) * h;
    camCtx.lineWidth = calibrating ? 2.5 : 1.5;
    camCtx.strokeStyle = framingOk
      ? (calibrating ? 'rgba(90,240,150,.95)' : 'rgba(90,240,150,.35)')
      : (calibrating ? 'rgba(255,190,80,.95)' : 'rgba(255,190,80,.5)');
    camCtx.setLineDash(framingOk ? [] : [7, 5]);
    camCtx.strokeRect(bx, by, bw, bh);
    camCtx.setLineDash([]);
    if (calibrating && !framingOk && framingHint) {
      camCtx.fillStyle = 'rgba(8,12,24,.8)';
      camCtx.fillRect(0, h - 26, w, 26);
      camCtx.fillStyle = '#ffbe50';
      camCtx.font = '600 13px -apple-system, system-ui, sans-serif';
      camCtx.textAlign = 'center';
      camCtx.fillText(framingHint, w / 2, h - 8);
      camCtx.textAlign = 'left';
    }
  }

  if (calibrated) {
    const th = poseTh();
    // The detector works in shoulder-widths from the frame centre; the guides
    // have to be projected back into frame coordinates to be drawn, which is
    // what the current apparent scale is for. They therefore move with you as
    // you change distance, which is the point — so do the trigger thresholds.
    const asp = videoAspect();
    const toX = n => (0.5 + n * sTorso / asp) * w;
    const toY = n => (0.5 + n * sTorso) * h;

    for (const s of [-1, 1]) {
      const x = toX(baseCX + s * th.lane);
      camCtx.strokeStyle = 'rgba(67,232,255,.6)'; camCtx.lineWidth = 1.5;
      camCtx.setLineDash([5, 4]);
      camCtx.beginPath(); camCtx.moveTo(x, 0); camCtx.lineTo(x, h); camCtx.stroke();
    }
    const bV = hipsUsable ? baseHipY : baseShY;
    camCtx.setLineDash([4, 4]);
    camCtx.strokeStyle = 'rgba(120,255,180,.5)';
    const jy = toY(bV - th.jump);
    camCtx.beginPath(); camCtx.moveTo(0, jy); camCtx.lineTo(w, jy); camCtx.stroke();
    camCtx.strokeStyle = 'rgba(255,140,120,.5)';
    const dy = toY(baseShY + th.duck);       // crouch reads off the shoulders
    camCtx.beginPath(); camCtx.moveTo(0, dy); camCtx.lineTo(w, dy); camCtx.stroke();
    camCtx.setLineDash([]);
    camCtx.strokeStyle = 'rgba(255,210,63,.55)';
    const by = toY(bV);
    camCtx.beginPath(); camCtx.moveTo(0, by); camCtx.lineTo(w, by); camCtx.stroke();
  }

  const lm = result && result.landmarks && result.landmarks[0];
  if (lm) {
    camCtx.fillStyle = '#ff4d9e';
    for (const i of [0, 11, 12, 23, 24, 25, 26]) {
      const p = lm[i]; if (!p) continue;
      camCtx.beginPath();
      camCtx.arc((1 - p.x) * w, p.y * h, 3.5, 0, 7);
      camCtx.fill();
    }
  }
}

document.getElementById('recal').onclick = () => { if (mode === 'pose') startCalibration(); };

// debug hooks (used by automated tests; harmless in production)
window.__g = g;
window.__dbg = {
  get phase() { return phase; },
  set phase(p) { phase = p; },
  freeze() { phase = 'frozen'; render(performance.now()); },
  get summaryT() { return summaryT; },
  set summaryT(v) { summaryT = v; if (phase === 'summary') renderSummary(performance.now()); },
  get camX() { return camX; },
  get camY() { return camY; },
  get camRoll() { return camRoll; },
  step: (n = 1, dt = 1 / 60) => {
    for (let i = 0; i < n && phase === 'playing'; i++) {
      update(dt);
      decayFx(dt);
      trackCamera(dt);
    }
    render(performance.now());
  },
  startPlay, doJump, doDuck, setLane,
  music,
  // pose internals, so the detector can be driven with synthetic landmarks
  handlePose, startCalibration, poseTh, drawCam,
  setVideo: v => { video = v; },
  poseBase: () => ({ baseHipY, baseShY, baseCX, baseTorso, calibrated, jumpArmed, hipsUsable }),
  poseSignals: () => ({
    sHipY, sShY, sTorso, hipsUsable, jumpArmed,
    rise: hipsUsable ? baseHipY - sHipY : baseShY - sShY,   // shoulder-widths
    drop: hipsUsable ? Math.max(sShY - baseShY, sHipY - baseHipY) : sShY - baseShY,
    poseDuck: g.poseDuck, lastDuckAt, lastJumpAt,
  }),
  setCalibrated: v => { calibrated = v; },
};
updateHearts();

// Restore an account session, if accounts are configured. If the cloud holds a
// higher best score (e.g. set on another device), adopt it.
initAccounts((cloudBest) => {
  if (cloudBest > best) { best = cloudBest; bestEl.textContent = `BEST ${best}`; }
});

showMenu();
requestAnimationFrame(tick);
